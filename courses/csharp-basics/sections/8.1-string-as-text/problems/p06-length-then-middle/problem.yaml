id: p06-length-then-middle
title: Length then middle character
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print s.Length then s[s.Length/2]. Vary odd/even length and content. Input non-empty.
cases:
  - { stdin: "hello", note: "len 5, middle index 2 -> l" }
  - { stdin: "test", note: "len 4, middle index 2 -> s" }
  - { stdin: "a", note: "edge - len 1, index 0 -> a" }
  - { stdin: "abcdef", note: "len 6, index 3 -> d" }
