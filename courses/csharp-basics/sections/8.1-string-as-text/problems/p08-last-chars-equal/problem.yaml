id: p08-last-chars-equal
title: Last characters equal
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read two lines, print whether a[Length-1] == b[Length-1]. Vary match/mismatch and lengths. Non-empty.
cases:
  - { stdin: "cats\ndogs", note: "both s: True" }
  - { stdin: "cat\ndog", note: "t vs g: False" }
  - { stdin: "go\nyo", note: "both o: True" }
  - { stdin: "a\nbcd", note: "a vs d: False" }
