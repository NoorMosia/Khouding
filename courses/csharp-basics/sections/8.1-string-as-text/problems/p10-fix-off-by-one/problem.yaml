id: p10-fix-off-by-one
title: Fix the off-by-one
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter reads s[s.Length] (crashes). Fix to s[s.Length-1] (last char). Vary last char/length.
cases:
  - { stdin: "hello", note: "last is o" }
  - { stdin: "cat", note: "last is t" }
  - { stdin: "z", note: "edge - single char: z" }
  - { stdin: "the end", note: "last is d" }
