id: p04-char-at-index
title: Character at an index
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a line and an index (0..Length-1), print s[index]. Vary text and index (first/mid/last). In bounds.
cases:
  - { stdin: "hello\n1", note: "e" }
  - { stdin: "hello\n0", note: "first: h" }
  - { stdin: "hello\n4", note: "last in-bounds: o" }
  - { stdin: "abcdef\n3", note: "d" }
