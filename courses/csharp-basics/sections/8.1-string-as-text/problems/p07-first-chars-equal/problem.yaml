id: p07-first-chars-equal
title: First characters equal
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read two lines, print whether a[0] == b[0] (True/False). Vary match/mismatch; case matters. Non-empty.
cases:
  - { stdin: "apple\nant", note: "both a: True" }
  - { stdin: "apple\nbanana", note: "a vs b: False" }
  - { stdin: "Ace\nace", note: "A vs a: False (case matters)" }
  - { stdin: "x\nxylophone", note: "both x: True" }
