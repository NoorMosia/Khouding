id: p06-can-vote
title: Can vote
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Realistic one-way guard with >=: print "can vote" only if age >= 18. Boundary 18 -> runs.
cases:
  - { stdin: "25", note: "runs -> can vote" }
  - { stdin: "18", note: "runs (18 counts)" }
  - { stdin: "17", note: "skips" }
  - { stdin: "0",  note: "skips" }
