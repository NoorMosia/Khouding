solution:
  csharp: [solution.cs]
# Inside vs outside: "Checked" always prints (outside the if); "overdrawn" only if balance < 0 (inside).
cases:
  - { stdin: "-50", note: "Checked then overdrawn" }
  - { stdin: "0",   note: "Checked only (0 is not < 0)" }
  - { stdin: "100", note: "Checked only" }
  - { stdin: "-1",  note: "Checked then overdrawn (just below)" }
