id: p05-low-stock
title: Low stock
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Realistic one-way guard: print "reorder" only if stock < 10. Boundary exactly 10 -> skip.
cases:
  - { stdin: "3",  note: "runs -> reorder" }
  - { stdin: "10", note: "skips (10 is not < 10)" }
  - { stdin: "9",  note: "runs (just below)" }
  - { stdin: "50", note: "skips" }
