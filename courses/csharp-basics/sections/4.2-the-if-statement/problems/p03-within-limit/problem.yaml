id: p03-within-limit
title: Within the limit
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# One-way if with <=: print "freezing" only if temp <= 0. Boundary exactly 0 -> runs.
cases:
  - { stdin: "-5", note: "runs (below zero)" }
  - { stdin: "0",  note: "runs (0 counts, <= includes it)" }
  - { stdin: "1",  note: "skips (just above)" }
  - { stdin: "20", note: "skips" }
