id: p08-over-budget
title: Over budget
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Compute-in-branch: if spend > budget, print the overage (spend - budget). Else nothing after the prompts.
cases:
  - { stdin: "120\n100", note: "over -> 20" }
  - { stdin: "100\n100", note: "skips (equal is not over)" }
  - { stdin: "80\n100",  note: "skips (under)" }
  - { stdin: "250\n100", note: "over -> 150" }
