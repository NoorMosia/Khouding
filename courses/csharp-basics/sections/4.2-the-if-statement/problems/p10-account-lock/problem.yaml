id: p10-account-lock
title: Account lock
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: always print "Attempts recorded"; if attempts > limit, also print "account locked". Straddle the limit.
cases:
  - { stdin: "5\n3",  note: "recorded + locked (over)" }
  - { stdin: "3\n3",  note: "recorded only (equal is not over)" }
  - { stdin: "1\n3",  note: "recorded only (under)" }
  - { stdin: "10\n3", note: "recorded + locked" }
