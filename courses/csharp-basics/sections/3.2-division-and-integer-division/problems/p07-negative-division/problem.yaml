id: p07-negative-division
title: Negative division
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b (int, a may be negative); print a / b. Integer division truncates toward zero.
cases:
  - { stdin: "-7\n2",  note: "-3 (toward zero, not -4)" }
  - { stdin: "7\n-2",  note: "-3" }
  - { stdin: "-8\n2",  note: "-4 exact" }
  - { stdin: "-5\n8",  note: "0 (toward zero)" }
