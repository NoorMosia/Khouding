id: p02-read-integer-quotient
title: Read an integer quotient
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b (int); print a / b (int division, truncates). Varied inputs defeat a hardcoded literal.
cases:
  - { stdin: "7\n2",   note: "3 (truncated from 3.5)" }
  - { stdin: "9\n3",   note: "3 exact" }
  - { stdin: "10\n4",  note: "2 (truncated from 2.5)" }
  - { stdin: "5\n8",   note: "0 (smaller over larger)" }
