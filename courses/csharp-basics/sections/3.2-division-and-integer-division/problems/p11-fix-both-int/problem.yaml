id: p11-fix-both-int
title: Fix the whole-number division
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter does a / b with both int, so it truncates. Fix: (double)a / b for the decimal. Clean-dividing values.
cases:
  - { stdin: "7\n2",   note: "want 3.5, buggy prints 3" }
  - { stdin: "9\n4",   note: "want 2.25, buggy prints 2" }
  - { stdin: "1\n4",   note: "want 0.25, buggy prints 0" }
  - { stdin: "10\n8",  note: "want 1.25, buggy prints 1" }
