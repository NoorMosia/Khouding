id: p04-read-decimal-quotient
title: Read a decimal quotient
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b as double; print a / b (decimal division). Values chosen so the quotient prints cleanly.
cases:
  - { stdin: "7\n2",   note: "3.5" }
  - { stdin: "9\n4",   note: "2.25" }
  - { stdin: "1\n4",   note: "0.25" }
  - { stdin: "10\n8",  note: "1.25" }
