# A (7.1): read n then n values; print the length then the last element. n >= 1. Vary length and values.
cases:
  - { stdin: "4\n10\n20\n30\n40", note: "length 4, last 40" }
  - { stdin: "1\n7", note: "edge - length 1, last 7" }
  - { stdin: "3\n-1\n-2\n-3", note: "negatives, last -3" }
  - { stdin: "5\n5\n4\n3\n2\n9", note: "length 5, last 9" }
