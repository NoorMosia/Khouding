# A (7.1): read n, n values, an index; print a[index]. Vary length, values, index (first/last). In bounds.
cases:
  - { stdin: "4\n10\n20\n30\n40\n2", note: "index 2 -> 30" }
  - { stdin: "3\n7\n8\n9\n0", note: "first index -> 7" }
  - { stdin: "3\n7\n8\n9\n2", note: "last index -> 9" }
  - { stdin: "1\n42\n0", note: "edge - length 1 -> 42" }
