grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E, fix the broken program: money printed as a raw double (no :F2). Fix: add :F2 so it shows two decimals.
cases:
  - { stdin: "7.5",   note: must become 7.50 }
  - { stdin: "10",    note: must become 10.00 }
  - { stdin: "19.95", note: already two decimals }
  - { stdin: "0",     note: must become 0.00 }
