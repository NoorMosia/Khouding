  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E, fix the broken program: int.Parse on a decimal price fails at run time. Fix: use double / double.Parse.
# All cases feed decimals, so the int starter throws and only the double fix passes.
cases:
  - { stdin: "4.99",  note: typical price }
  - { stdin: "7.5",   note: one decimal place }
  - { stdin: "0.5",   note: under one }
  - { stdin: "12.25", note: larger }
