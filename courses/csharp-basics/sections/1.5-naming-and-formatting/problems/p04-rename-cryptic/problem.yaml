id: p04-rename-cryptic
title: Rename cryptic variables
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Working but cryptic (x, a2, q). Rename to meaningful names; output is unchanged
# (reads two numbers, prints their product). Varied inputs resist hardcoding.
cases:
  - { stdin: "7\n5",   note: normal; 35 }
  - { stdin: "3\n10",  note: different values }
  - { stdin: "0\n9",   note: edge - zero }
  - { stdin: "12\n12", note: larger }
