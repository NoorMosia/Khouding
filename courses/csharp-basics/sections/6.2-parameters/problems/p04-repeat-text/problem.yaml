id: p04-repeat-text
title: Repeat text
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two parameters (string + int): method prints a text argument n times (loop inside). Main reads both.
# Vary the count incl. zero.
cases:
  - { stdin: "hi\n3",  note: "hi three times" }
  - { stdin: "yo\n1",  note: "yo once" }
  - { stdin: "x\n0",   note: "zero times: nothing after the prompts" }
  - { stdin: "ok\n4",  note: "ok four times" }
