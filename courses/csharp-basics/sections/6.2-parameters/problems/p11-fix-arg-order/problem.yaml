id: p11-fix-arg-order
title: Fix the argument order
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Debug: method prints first - second. Starter passes the arguments swapped, so the sign is wrong. Fix the
# order. Silent, terminating. Main reads a then b, should print a - b.
cases:
  - { stdin: "10\n3", note: "10 - 3 = 7 (buggy prints -7)" }
  - { stdin: "3\n10", note: "3 - 10 = -7 (buggy prints 7)" }
  - { stdin: "5\n5",  note: "0 (same either way)" }
  - { stdin: "0\n4",  note: "0 - 4 = -4 (buggy prints 4)" }
