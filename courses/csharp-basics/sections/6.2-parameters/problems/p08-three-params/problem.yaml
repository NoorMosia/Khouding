# Three params: method prints a formatted line "<label>: <a> + <b> = <sum>". Main reads all three.
cases:
  - { stdin: "sum\n4\n6",   note: "sum: 4 + 6 = 10" }
  - { stdin: "total\n0\n0", note: "total: 0 + 0 = 0" }
  - { stdin: "r\n-2\n5",    note: "r: -2 + 5 = 3" }
