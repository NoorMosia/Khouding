# Extend: starter has Add(int,int) only; Main also calls Add(a,b,c), which matches no overload (does not
# compile). Add the three-parameter overload. Main reads a,b,c; prints Add(a,b) then Add(a,b,c).
cases:
  - { stdin: "2\n3\n4",  note: "5 then 9" }
  - { stdin: "0\n0\n0",  note: "0 then 0" }
  - { stdin: "-1\n5\n2", note: "4 then 6" }
