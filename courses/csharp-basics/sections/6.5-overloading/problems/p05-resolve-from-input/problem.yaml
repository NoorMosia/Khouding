id: p05-resolve-from-input
title: Resolve from input
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Resolve from input: read a mode (2 or 3) and three numbers a,b,c. If mode is 2, print Add(a,b); if 3,
# print Add(a,b,c). Exercises both overloads depending on input.
cases:
  - { stdin: "2\n4\n5\n6", note: "mode 2 -> Add(4,5) = 9" }
  - { stdin: "3\n4\n5\n6", note: "mode 3 -> Add(4,5,6) = 15" }
  - { stdin: "2\n0\n0\n9", note: "mode 2 -> 0" }
  - { stdin: "3\n1\n2\n3", note: "mode 3 -> 6" }
