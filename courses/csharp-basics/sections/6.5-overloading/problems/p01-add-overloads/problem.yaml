# Overload by count: Add(int,int) and Add(int,int,int). Main reads a,b,c; prints Add(a,b) then Add(a,b,c).
cases:
  - { stdin: "2\n3\n4",  note: "5 then 9" }
  - { stdin: "0\n0\n0",  note: "0 then 0" }
  - { stdin: "-1\n5\n2", note: "4 then 6" }
  - { stdin: "10\n20\n30", note: "30 then 60" }
