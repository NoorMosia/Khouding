id: p03-describe-by-type
title: Describe by type
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Overload by type: Describe(int) prints "number: <n>", Describe(string) prints "text: <s>".
# Main reads an int (line 1) and a word (line 2), calls each overload.
cases:
  - { stdin: "5\nhi",   note: "number: 5 / text: hi" }
  - { stdin: "0\nok",   note: "number: 0 / text: ok" }
  - { stdin: "-3\nyes", note: "number: -3 / text: yes" }
