id: p08-type-resolution
title: Type resolution
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Overload by type: Show(int) prints "int <n>"; Show(bool) prints "bool <True/False>". Main reads an int and
# a 0/1 flag, calls Show(n) then Show(flag == 1).
cases:
  - { stdin: "7\n1", note: "int 7 / bool True" }
  - { stdin: "0\n0", note: "int 0 / bool False" }
  - { stdin: "-3\n1", note: "int -3 / bool True" }
