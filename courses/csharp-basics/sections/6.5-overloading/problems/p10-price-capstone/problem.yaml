id: p10-price-capstone
title: Price capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: overloaded Price. Price(int qty) uses a default unit price of 10 -> qty*10.
# Price(int qty, int unit) -> qty*unit. Main reads qty and unit; prints Price(qty) then Price(qty, unit).
cases:
  - { stdin: "3\n5",  note: "default 30 then 15" }
  - { stdin: "0\n9",  note: "0 then 0" }
  - { stdin: "4\n10", note: "40 then 40" }
  - { stdin: "2\n7",  note: "20 then 14" }
