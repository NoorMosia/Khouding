id: p04-area-overloads
title: Area overloads
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count overload (geometry): Area(side) = side*side (square); Area(w,h) = w*h (rectangle).
# Main reads side, w, h; prints Area(side) then Area(w,h).
cases:
  - { stdin: "4\n3\n5",  note: "16 then 15" }
  - { stdin: "1\n1\n1",  note: "1 then 1" }
  - { stdin: "0\n6\n7",  note: "0 then 42" }
  - { stdin: "10\n2\n9", note: "100 then 18" }
