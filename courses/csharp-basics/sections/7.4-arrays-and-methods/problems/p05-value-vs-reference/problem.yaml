id: p05-value-vs-reference
title: Value versus reference
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two methods: int param unchanged, array element changed. Print n then array[0]. Vary both inputs.
cases:
  - { stdin: "5\n5", note: "n stays 5, array[0] becomes 6" }
  - { stdin: "0\n10", note: "n stays 0, array[0] becomes 11" }
  - { stdin: "-3\n-1", note: "n stays -3, array[0] becomes 0" }
  - { stdin: "100\n7", note: "n stays 100, array[0] becomes 8" }
