id: p09-return-new-doubled
title: Return a new doubled array
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# int[] Doubled(int[] a) returns a NEW array; original unchanged. Print doubled, "---", original.
cases:
  - { stdin: "3\n1\n2\n3", note: "doubled 2 4 6, original 1 2 3" }
  - { stdin: "1\n5", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: just the --- line" }
  - { stdin: "2\n-4\n0", note: "negative and zero" }
