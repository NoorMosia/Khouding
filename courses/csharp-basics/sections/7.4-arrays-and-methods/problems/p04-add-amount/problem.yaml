id: p04-add-amount
title: Add an amount to every element
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# void AddAll(int[] a, int amount) mutates in place. Vary values/amount; negative amount; length 0.
cases:
  - { stdin: "3\n1\n2\n3\n10", note: "add 10" }
  - { stdin: "3\n5\n5\n5\n-5", note: "add -5: all zero" }
  - { stdin: "0\n4", note: "edge - length 0: prints nothing" }
  - { stdin: "1\n7\n3", note: "edge - length 1: 10" }
