id: p03-double-all
title: Double every element
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# void DoubleAll(int[] a) mutates in place; Main prints the changed array. Vary length incl. 0 and 1.
cases:
  - { stdin: "3\n1\n2\n3", note: "normal: 2 4 6" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "1\n7", note: "edge - length 1: 14" }
  - { stdin: "3\n-1\n0\n5", note: "negative and zero" }
