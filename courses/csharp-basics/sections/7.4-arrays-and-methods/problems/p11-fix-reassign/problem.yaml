id: p11-fix-reassign
title: Fix the reassigned parameter
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter reassigns the parameter (caller unchanged). Fix: mutate elements. Vary length incl. 0 and 1.
cases:
  - { stdin: "3\n1\n2\n3", note: "doubled: 2 4 6" }
  - { stdin: "1\n5", note: "edge - length 1: 10" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "3\n-2\n0\n4", note: "negative and zero" }
