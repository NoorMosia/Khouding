# The one-line payoff: "Total: {total}" on a single interpolated line.
cases:
  - { stdin: "3\n4",     note: typical }
  - { stdin: "0\n0",     note: zero total }
  - { stdin: "-5\n5",    note: cancels to zero }
  - { stdin: "100\n250", note: larger }
