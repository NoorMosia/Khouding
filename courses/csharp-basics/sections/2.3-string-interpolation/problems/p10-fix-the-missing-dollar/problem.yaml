id: p10-fix-the-missing-dollar
title: Fix the missing dollar sign
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter has no $ prefix: it compiles and runs but prints "{name}" literally. Fix: add the $.
cases:
  - { stdin: "Ada",    note: typical }
  - { stdin: "Grace",  note: different name }
  - { stdin: "Al",     note: short name }
  - { stdin: "Jun-ho", note: name with a hyphen }
