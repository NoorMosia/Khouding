# Compose a described sentence from two read values of different types, holes not in input order.
cases:
  - { stdin: "pens\n3",    note: typical }
  - { stdin: "notebook\n1", note: quantity one }
  - { stdin: "chairs\n0",  note: quantity zero }
  - { stdin: "coffee beans\n12", note: item with a space }
