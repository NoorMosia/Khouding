grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two holes on one line with a literal comma-space between them.
cases:
  - { stdin: "Lisbon\nPortugal", note: typical pair }
  - { stdin: "Nairobi\nKenya",   note: different pair }
  - { stdin: "Lima\nPeru",       note: short names }
  - { stdin: "Hanoi\nViet Nam",  note: country with a space }
