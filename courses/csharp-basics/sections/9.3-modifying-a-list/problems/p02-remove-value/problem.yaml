id: p02-remove-value
title: Remove a value
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Remove a read value (present), print new Count. Vary what is removed.
cases:
  - { stdin: "4\n10\n20\n30\n40\n20", note: "3" }
  - { stdin: "3\n5\n5\n5\n5", note: "removes first 5: 2" }
  - { stdin: "1\n7\n7", note: "removes only element: 0" }
  - { stdin: "3\n1\n2\n3\n3", note: "removes last: 2" }
