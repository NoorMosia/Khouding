# Insert a value at a read index; print all elements. Vary position (front/mid/end).
cases:
  - { stdin: "3\n10\n20\n30\n1\n99", note: "10 99 20 30" }
  - { stdin: "3\n10\n20\n30\n0\n5", note: "insert at front: 5 10 20 30" }
  - { stdin: "3\n10\n20\n30\n3\n5", note: "insert at end: 10 20 30 5" }
  - { stdin: "2\n1\n2\n1\n9", note: "1 9 2" }
