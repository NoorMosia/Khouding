id: p09-two-removeat
title: Two RemoveAt calls
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Remove two indexes (larger first to avoid shift), print remaining. List >= 2 elements.
cases:
  - { stdin: "4\n10\n20\n30\n40", note: "remove last(40) then first(10): 20 30" }
  - { stdin: "3\n5\n6\n7", note: "remove last(7) then first(5): 6" }
  - { stdin: "5\n1\n2\n3\n4\n5", note: "remove last(5) then first(1): 2 3 4" }
  - { stdin: "2\n9\n8", note: "remove last(8) then first(9): nothing" }
