solution:
  csharp: [solution.cs]
# RemoveAt a read index; print remaining elements. Vary which index (first/mid/last).
cases:
  - { stdin: "4\n10\n20\n30\n40\n1", note: "10 30 40" }
  - { stdin: "4\n10\n20\n30\n40\n0", note: "removes first: 20 30 40" }
  - { stdin: "4\n10\n20\n30\n40\n3", note: "removes last: 10 20 30" }
  - { stdin: "2\n5\n6\n0", note: "5 removed: 6" }
