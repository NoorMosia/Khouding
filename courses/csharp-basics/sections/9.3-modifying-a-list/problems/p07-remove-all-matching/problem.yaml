# Remove all occurrences of a value. Vary: all removed, some, none.
cases:
  - { stdin: "5\n1\n2\n2\n3\n2\n2", note: "1 3" }
  - { stdin: "3\n1\n2\n3\n9", note: "none removed: 1 2 3" }
  - { stdin: "4\n5\n5\n5\n5\n5", note: "all removed: nothing" }
