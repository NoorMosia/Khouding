  csharp: [solution.cs]
# Step the index by 2 (indexes 0,2,4,...). Vary length: even, odd, 1, 0.
cases:
  - { stdin: "5\n10\n20\n30\n40\n50", note: "odd length: indexes 0,2,4" }
  - { stdin: "4\n1\n2\n3\n4", note: "even length: indexes 0,2" }
  - { stdin: "1\n9", note: "edge - length 1: index 0" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
