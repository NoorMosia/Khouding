id: p04-reverse-order
title: Reverse order
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print elements from last to first. Vary length incl. 0 and 1.
cases:
  - { stdin: "3\n10\n20\n30", note: "normal" }
  - { stdin: "1\n5", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "4\n1\n2\n3\n4", note: "longer" }
