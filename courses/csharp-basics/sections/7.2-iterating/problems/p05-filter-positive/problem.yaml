id: p05-filter-positive
title: Only the positives
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Filter shape: print only elements > 0. Vary so none/some/all pass; incl. length 0.
cases:
  - { stdin: "4\n-3\n4\n0\n7", note: "some pass" }
  - { stdin: "3\n-1\n-2\n-3", note: "none pass: prints nothing" }
  - { stdin: "3\n1\n2\n3", note: "all pass" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
