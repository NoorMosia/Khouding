id: p12-labelled-positives
title: Labelled positives
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: filter (>0) + running 1-based label over printed items only. Vary none/some/all; length 0.
cases:
  - { stdin: "5\n-3\n4\n0\n7\n-1", note: "some positive: labels 1,2" }
  - { stdin: "3\n-1\n-2\n-3", note: "none positive: prints nothing" }
  - { stdin: "3\n5\n6\n7", note: "all positive: labels 1,2,3" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
