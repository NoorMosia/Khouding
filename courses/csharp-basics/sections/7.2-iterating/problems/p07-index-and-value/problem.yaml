id: p07-index-and-value
title: Index and value
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print "a[i] = value" with 0-based index. Vary length incl. 0 and 1.
cases:
  - { stdin: "3\n10\n20\n30", note: "normal" }
  - { stdin: "1\n5", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "2\n-7\n8", note: "negatives" }
