id: p03-numbered-positions
title: Numbered positions
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print "pos: value" with 1-based pos; needs the index. Vary length incl. 0 and 1.
cases:
  - { stdin: "3\n10\n20\n30", note: "normal" }
  - { stdin: "1\n99", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "2\n-5\n8", note: "negatives" }
