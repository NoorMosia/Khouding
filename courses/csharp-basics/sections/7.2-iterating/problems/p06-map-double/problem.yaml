# Map shape: print each element * 2. Vary values and length incl. 0; include negatives/zero.
cases:
  - { stdin: "3\n1\n2\n3", note: "normal" }
  - { stdin: "3\n-1\n0\n5", note: "negative and zero" }
  - { stdin: "1\n7", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
