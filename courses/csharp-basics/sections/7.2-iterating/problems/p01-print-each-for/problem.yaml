id: p01-print-each-for
title: Print each (indexed for)
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count-then-values; print each with indexed for. Vary length incl. 0 (nothing) and 1.
cases:
  - { stdin: "3\n10\n20\n30", note: "normal" }
  - { stdin: "1\n42", note: "edge - length 1" }
  - { stdin: "0", note: "edge - length 0: prints nothing" }
  - { stdin: "4\n-1\n0\n5\n-9", note: "negatives and zero" }
