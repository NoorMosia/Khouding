# Accumulate a running total over the array, print it. Vary length incl. 0 (sum 0) and negatives.
cases:
  - { stdin: "3\n10\n20\n30", note: "normal: 60" }
  - { stdin: "0", note: "edge - length 0: sum is 0" }
  - { stdin: "4\n-1\n-2\n3\n5", note: "negatives: 5" }
  - { stdin: "1\n7", note: "edge - length 1: 7" }
