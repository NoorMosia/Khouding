id: p02-read-a-decimal
title: Read a decimal
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Parse the line to a double, print it back. Pick values that print cleanly.
cases:
  - { stdin: "3.5",   note: one decimal place }
  - { stdin: "0",     note: zero }
  - { stdin: "-2.25", note: negative decimal }
  - { stdin: "12.75", note: larger decimal }
