id: p06-average
title: Average of n values
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count + arithmetic: read count n (>= 1), then n values, print the integer average (sum / n, truncating).
# n always >= 1 (no divide by zero). Cases exercise truncation and negatives.
cases:
  - { stdin: "4\n2\n4\n6\n8", note: "sum 20 / 4 = 5" }
  - { stdin: "3\n1\n2\n2",    note: "sum 5 / 3 = 1 (integer division truncates)" }
  - { stdin: "1\n9",          note: "single value -> 9" }
  - { stdin: "2\n10\n5",      note: "15 / 2 = 7 (truncates)" }
  - { stdin: "3\n-3\n-3\n-3", note: "negatives: -9 / 3 = -3" }
