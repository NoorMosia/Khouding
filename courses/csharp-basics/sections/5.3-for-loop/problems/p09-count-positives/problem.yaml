id: p09-count-positives
title: Count positives
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count + condition: read count n, then n values, print how many are > 0. n = 0 -> 0.
cases:
  - { stdin: "4\n3\n-1\n5\n0", note: "positives: 3 and 5 -> 2 (0 not positive)" }
  - { stdin: "3\n-2\n-5\n-1",  note: "none -> 0" }
  - { stdin: "3\n1\n2\n3",     note: "all -> 3" }
  - { stdin: "0",              note: "zero iterations -> 0" }
