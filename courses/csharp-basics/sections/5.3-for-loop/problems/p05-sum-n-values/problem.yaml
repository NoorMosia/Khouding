id: p05-sum-n-values
title: Sum n values
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count pattern: read count n, then n values, print the sum. n = 0 -> 0.
cases:
  - { stdin: "3\n5\n7\n2",      note: "14" }
  - { stdin: "1\n9",            note: "9" }
  - { stdin: "0",               note: "zero iterations -> 0" }
  - { stdin: "4\n1\n-2\n3\n-1", note: "1" }
