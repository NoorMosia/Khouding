id: p07-max
title: Max of n values
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Running max with a for: read count n (>= 1), then n values, print the largest. Seed from first read.
cases:
  - { stdin: "4\n3\n9\n2\n7", note: "max 9 (middle)" }
  - { stdin: "1\n5",          note: "single -> 5" }
  - { stdin: "3\n-4\n-1\n-9", note: "all negative -> -1" }
  - { stdin: "3\n6\n6\n2",    note: "duplicate max -> 6" }
