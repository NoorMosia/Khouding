id: p15-temps-capstone
title: Temperatures capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: read count n (>= 1), then a threshold, then n daily temperatures. Print two lines:
# the integer average of the temperatures, and how many are strictly above the threshold.
# Threshold is read BEFORE the temperatures so the count is done in the loop (no arrays).
cases:
  - { stdin: "4\n22\n20\n25\n18\n30", note: "avg (20+25+18+30)/4=23; above 22: 25,30 -> 2" }
  - { stdin: "1\n10\n15",             note: "avg 15; above 10: 1" }
  - { stdin: "3\n5\n5\n5\n5",         note: "avg 5; above 5: none -> 0 (strict)" }
  - { stdin: "2\n-5\n-4\n-10",        note: "avg (-14)/2=-7; above -5: -4 -> 1" }
  - { stdin: "3\n15\n10\n20\n30",     note: "avg 20; above 15: 20,30 -> 2" }
