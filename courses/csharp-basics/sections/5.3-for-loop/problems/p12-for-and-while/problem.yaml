id: p12-for-and-while
title: for and while agree
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Equivalence: print 1..n with a for loop, then a line "---", then 1..n again with a while loop.
# Both blocks must match. n = 0 -> only the "---" line between two empty blocks.
cases:
  - { stdin: "3", note: "1 2 3 / --- / 1 2 3" }
  - { stdin: "1", note: "1 / --- / 1" }
  - { stdin: "0", note: "empty / --- / empty -> just the --- line" }
  - { stdin: "4", note: "1..4 twice around ---" }
