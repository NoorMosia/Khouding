id: p14-fix-wrong-step
title: Fix the wrong step
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Debug: should print evens 2..n (step by 2) but starter uses i++ (step by 1), printing all numbers.
# Fix the update to i += 2. Silent, terminating.
cases:
  - { stdin: "10", note: "2 4 6 8 10 (buggy prints 2..10 all)" }
  - { stdin: "9",  note: "2 4 6 8 (buggy prints 2..9 all)" }
  - { stdin: "2",  note: "just 2" }
  - { stdin: "1",  note: "n < 2: nothing" }
