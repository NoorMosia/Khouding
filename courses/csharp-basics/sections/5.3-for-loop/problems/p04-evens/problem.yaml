id: p04-evens
title: Evens up to n
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Step by 2: read n, print 2, 4, 6, ... up to and including n, one per line. n < 2 -> nothing.
cases:
  - { stdin: "10", note: "2 4 6 8 10 (10 included)" }
  - { stdin: "9",  note: "2 4 6 8 (9 odd, stops at 8)" }
  - { stdin: "1",  note: "n < 2: nothing" }
  - { stdin: "2",  note: "just 2" }
  - { stdin: "0",  note: "nothing" }
