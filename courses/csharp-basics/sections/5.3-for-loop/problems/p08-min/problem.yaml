id: p08-min
title: Min of n values
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Running min with a for: read count n (>= 1), then n values, print the smallest. Seed from first read.
cases:
  - { stdin: "4\n3\n9\n2\n7", note: "min 2 (middle)" }
  - { stdin: "1\n5",          note: "single -> 5" }
  - { stdin: "3\n4\n1\n9",    note: "min 1" }
  - { stdin: "3\n-2\n-8\n-1", note: "all negative -> -8" }
  - { stdin: "3\n5\n5\n9",    note: "duplicate min -> 5" }
