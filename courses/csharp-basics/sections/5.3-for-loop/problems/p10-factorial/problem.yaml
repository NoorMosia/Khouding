id: p10-factorial
title: Product 1 to n
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Running product: read n, print 1*2*...*n (factorial). n = 0 -> 1 (the empty product). Keep n small to fit int.
cases:
  - { stdin: "4", note: "1*2*3*4 = 24" }
  - { stdin: "1", note: "1" }
  - { stdin: "0", note: "empty product -> 1 (zero iterations, product stays 1)" }
  - { stdin: "5", note: "120" }
  - { stdin: "6", note: "720" }
