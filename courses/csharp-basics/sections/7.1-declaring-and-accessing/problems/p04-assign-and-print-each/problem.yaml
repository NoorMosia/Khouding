id: p04-assign-and-print-each
title: Assign and print each
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Fill a[0..2] from reads, print each slot on its own line. Vary values incl. negatives/zeros.
cases:
  - { stdin: "10\n20\n30", note: "normal" }
  - { stdin: "0\n0\n0", note: "edge - zeros" }
  - { stdin: "-5\n4\n-1", note: "edge - negatives" }
  - { stdin: "7\n7\n7", note: "all equal" }
