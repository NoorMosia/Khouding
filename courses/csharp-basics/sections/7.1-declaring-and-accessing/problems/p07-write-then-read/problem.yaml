id: p07-write-then-read
title: Write then read a slot
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print old a[i], overwrite, print new a[i]. Vary values, index (incl. first/last), new value.
cases:
  - { stdin: "10\n20\n30\n1\n99", note: "overwrite middle" }
  - { stdin: "10\n20\n30\n0\n5", note: "overwrite first" }
  - { stdin: "10\n20\n30\n2\n-7", note: "overwrite last" }
  - { stdin: "1\n2\n3\n1\n2", note: "new equals old-neighbour value" }
