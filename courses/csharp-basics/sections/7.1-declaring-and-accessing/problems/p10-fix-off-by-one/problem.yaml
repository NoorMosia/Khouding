id: p10-fix-off-by-one
title: Fix the off-by-one
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter crashes on a[a.Length] (out of range). Fix to a[a.Length-1]. Vary last value.
cases:
  - { stdin: "10\n20\n30", note: "last is 30" }
  - { stdin: "1\n2\n3", note: "last is 3" }
  - { stdin: "-4\n0\n-9", note: "last negative" }
  - { stdin: "7\n7\n7", note: "all equal" }
