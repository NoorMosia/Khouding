id: p08-swap-two
title: Swap two elements
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read 2 numbers into a[0], a[1], swap via a temp, print a[0] then a[1]. Vary values incl. equal.
cases:
  - { stdin: "10\n20", note: "normal" }
  - { stdin: "20\n10", note: "reversed input" }
  - { stdin: "5\n5", note: "equal: swap is a no-op" }
  - { stdin: "-3\n8", note: "negatives" }
