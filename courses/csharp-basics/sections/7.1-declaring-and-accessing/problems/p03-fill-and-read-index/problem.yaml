id: p03-fill-and-read-index
title: Fill then read an index
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Fill a[0..2] from reads, read an index 0-2, print a[index]. Vary values and index (incl. first/last).
cases:
  - { stdin: "10\n20\n30\n1", note: "middle index" }
  - { stdin: "10\n20\n30\n0", note: "first index" }
  - { stdin: "10\n20\n30\n2", note: "last in-bounds index" }
  - { stdin: "7\n8\n9\n2", note: "different values" }
