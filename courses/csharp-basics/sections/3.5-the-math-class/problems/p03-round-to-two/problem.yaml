id: p03-round-to-two
title: Round to two
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a value; print Math.Round(value, 2). Avoid .xx5 ties so rounding is unambiguous. VERIFY via CLI.
cases:
  - { stdin: "3.14159", note: "3.14" }
  - { stdin: "2.718",   note: "2.72" }
  - { stdin: "9.871",   note: "9.87" }
  - { stdin: "1.004",   note: "1 (rounds to 1.00, prints 1)" }
