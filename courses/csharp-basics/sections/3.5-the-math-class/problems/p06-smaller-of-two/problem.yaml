id: p06-smaller-of-two
title: Smaller of two
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print Math.Min(a, b). Vary which one is smaller (incl equal, incl negative).
cases:
  - { stdin: "3\n9",   note: "3 (first smaller)" }
  - { stdin: "10\n4",  note: "4 (second smaller)" }
  - { stdin: "5\n5",   note: "5 (equal)" }
  - { stdin: "-7\n-2", note: "-7 (more negative is smaller)" }
