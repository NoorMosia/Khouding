id: p02-power
title: Power
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read base and exponent; print Math.Pow(base, exponent). Small whole powers so the result prints cleanly.
cases:
  - { stdin: "2\n10", note: "1024" }
  - { stdin: "5\n2",  note: "25" }
  - { stdin: "10\n3", note: "1000" }
  - { stdin: "7\n0",  note: "1 (anything to the 0 is 1)" }
