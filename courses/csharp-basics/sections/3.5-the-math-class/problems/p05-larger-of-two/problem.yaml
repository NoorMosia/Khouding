id: p05-larger-of-two
title: Larger of two
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print Math.Max(a, b). Vary which one is larger (incl equal, incl negative).
cases:
  - { stdin: "3\n9",   note: "9 (second larger)" }
  - { stdin: "10\n4",  note: "10 (first larger)" }
  - { stdin: "5\n5",   note: "5 (equal)" }
  - { stdin: "-7\n-2", note: "-2 (less negative is larger)" }
