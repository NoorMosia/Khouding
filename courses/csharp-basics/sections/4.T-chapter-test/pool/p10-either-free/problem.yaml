id: p10-either-free
title: Either way free
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# C: || gate. Free shipping if total >= 50 OR coupon flag == 1. Read total then coupon (0/1).
# Cases cover both-false (the only "paid"), each single-true path, and the total boundary.
cases:
  - { stdin: "60\n0", note: "over threshold -> free" }
  - { stdin: "20\n1", note: "coupon -> free" }
  - { stdin: "50\n0", note: "edge: 50 >= 50 -> free" }
  - { stdin: "20\n0", note: "neither -> paid" }
  - { stdin: "49\n0", note: "just under, no coupon -> paid" }
