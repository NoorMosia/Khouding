id: p09-in-range
title: In range
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# C: range check with && -> print the bool. 1..100 inclusive. Cases straddle both bounds.
cases:
  - { stdin: "50",  note: "inside -> True" }
  - { stdin: "1",   note: "low edge inclusive -> True" }
  - { stdin: "100", note: "high edge inclusive -> True" }
  - { stdin: "0",   note: "below -> False" }
  - { stdin: "101", note: "above -> False" }
