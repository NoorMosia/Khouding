# E, fix: starter writes if (n = 0) (assignment) instead of if (n == 0) (comparison). CS0029 compile error.
# Fix to ==. Print "zero" when n is 0, else "nonzero". Cases straddle 0.
cases:
  - { stdin: "0",  note: "zero" }
  - { stdin: "5",  note: "nonzero" }
  - { stdin: "-3", note: "nonzero (negative)" }
  - { stdin: "1",  note: "nonzero edge" }
