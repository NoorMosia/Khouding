# D: switch on a read string -> full word, default "unknown". Cases include an unmatched code and a lowercase miss.
cases:
  - { stdin: "GBP", note: "British Pound" }
  - { stdin: "USD", note: "US Dollar" }
  - { stdin: "EUR", note: "Euro" }
  - { stdin: "JPY", note: "unmatched code -> unknown (default)" }
  - { stdin: "usd", note: "lowercase, case-sensitive miss -> unknown (default)" }
