# B: multi-way band chain with low-first thresholds -> cold (<10) / warm (10..24) / hot (>=25).
# Cases reach every band and both boundaries.
cases:
  - { stdin: "5",  note: "cold" }
  - { stdin: "9",  note: "cold upper edge (< 10)" }
  - { stdin: "10", note: "warm low edge" }
  - { stdin: "24", note: "warm high edge" }
  - { stdin: "25", note: "hot low edge" }
  - { stdin: "40", note: "hot" }
