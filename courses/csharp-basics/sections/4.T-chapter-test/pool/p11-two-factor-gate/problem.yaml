id: p11-two-factor-gate
title: Two-factor gate
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# C: && across two factors. age >= 16 AND license == 1 -> "may drive" else "no". Read age then license (0/1).
# Cases cover all four truth combinations plus the age edge.
cases:
  - { stdin: "20\n1", note: "old enough and licensed -> may drive" }
  - { stdin: "20\n0", note: "old enough, no license -> no" }
  - { stdin: "15\n1", note: "licensed but too young -> no" }
  - { stdin: "15\n0", note: "neither -> no" }
  - { stdin: "16\n1", note: "age edge inclusive, licensed -> may drive" }
