id: p01-compare-two
title: Compare two
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# A: read two ints, print whether the first is greater than the second (a bool, True/False).
# Cases straddle the boundary: a > b, a < b, a == b.
cases:
  - { stdin: "7\n3",  note: "greater -> True" }
  - { stdin: "3\n7",  note: "smaller -> False" }
  - { stdin: "5\n5",  note: "equal -> False (not strictly greater)" }
  - { stdin: "-2\n-9", note: "negatives, greater -> True" }
