id: p13-shipping-cost
title: Shipping cost
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# C: nested tree with arithmetic. Base by weight (<=5 -> 5, else 10), plus 3 if zone != 1. Print the cost.
# Read weight then zone. Cases reach each weight band and each zone, plus the weight edge.
cases:
  - { stdin: "3\n1",  note: "light, zone 1 -> 5" }
  - { stdin: "3\n2",  note: "light, far zone -> 5 + 3 = 8" }
  - { stdin: "10\n1", note: "heavy, zone 1 -> 10" }
  - { stdin: "10\n2", note: "heavy, far zone -> 10 + 3 = 13" }
  - { stdin: "5\n2",  note: "weight edge: 5 is light, far -> 8" }
  - { stdin: "6\n1",  note: "just over edge: heavy, zone 1 -> 10" }
