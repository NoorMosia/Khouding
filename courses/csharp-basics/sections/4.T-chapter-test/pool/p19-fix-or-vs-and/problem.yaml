id: p19-fix-or-vs-and
title: Fix or vs and
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E, fix: range check uses || (x >= 10 || x <= 20) which is always true. Fix to &&. Prints the bool.
# Cases include values outside the band so the always-true bug is exposed.
cases:
  - { stdin: "15", note: "inside -> True" }
  - { stdin: "10", note: "low edge -> True" }
  - { stdin: "20", note: "high edge -> True" }
  - { stdin: "5",  note: "below: buggy || prints True, correct && prints False" }
  - { stdin: "25", note: "above: buggy || prints True, correct && prints False" }
