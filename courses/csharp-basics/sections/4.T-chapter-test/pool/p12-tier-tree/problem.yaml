# C: nested tree. Outer positive vs not. Inner (positive): even/odd via % 2.
# Leaves: "positive even", "positive odd", "not positive". Cases reach every leaf.
cases:
  - { stdin: "4",  note: "positive even" }
  - { stdin: "7",  note: "positive odd" }
  - { stdin: "-2", note: "not positive (inner never reached)" }
  - { stdin: "0",  note: "not positive (zero)" }
  - { stdin: "1",  note: "smallest positive odd" }
