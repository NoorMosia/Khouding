id: p18-fix-elseif-order
title: Fix the else-if order
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E, fix: grade chain ordered loosest-first (>=70 before >=90), so high scores wrongly get C. Silent wrong.
# Fix: order tightest-first. Cases hit each band incl. a 95 that exposes the bug.
cases:
  - { stdin: "95", note: "A; buggy order would print C" }
  - { stdin: "85", note: "B; buggy order would print C" }
  - { stdin: "75", note: "C (correct either way)" }
  - { stdin: "60", note: "fail" }
  - { stdin: "90", note: "A low edge; buggy order prints C" }
