id: p15-day-name
title: Day name
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# D: switch on a day int 1..7 -> name, default "unknown". Cases hit several days and the default on each side.
cases:
  - { stdin: "1", note: "Monday" }
  - { stdin: "5", note: "Friday" }
  - { stdin: "7", note: "Sunday (last valid)" }
  - { stdin: "8", note: "above -> unknown (default)" }
  - { stdin: "0", note: "below -> unknown (default)" }
