# Read each line as int, sum, multiply by stdin multiplier. Vary multiplier.
cases:
  - { stdin: "1", note: "sum * 1 = 100" }
  - { stdin: "2", note: "sum * 2 = 200" }
  - { stdin: "3", note: "sum * 3 = 300" }
  - { stdin: "0", note: "sum * 0 = 0" }
