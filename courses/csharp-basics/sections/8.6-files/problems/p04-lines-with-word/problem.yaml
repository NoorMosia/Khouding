id: p04-lines-with-word
title: Lines containing a word
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
asset_files:
  csharp: [data.txt]
# Read a word from stdin, print lines of data.txt that contain it. Vary the word.
cases:
  - { stdin: "cat", note: "two cat lines" }
  - { stdin: "park", note: "two park lines" }
  - { stdin: "the", note: "four lines with 'the'" }
  - { stdin: "zebra", note: "no match: nothing" }
