# Find max, count occurrences. n >= 1. Vary: unique, repeated, all equal.
cases:
  - { stdin: "4\n4\n9\n2\n7", note: "unique: 1" }
  - { stdin: "5\n3\n9\n9\n1\n9", note: "three 9s" }
  - { stdin: "3\n5\n5\n5", note: "all equal: 3" }
  - { stdin: "1\n7", note: "1" }
