grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read value and divisor (both int); print value /= divisor. Whole-number division, so it truncates (3.2).
cases:
  - { stdin: "17\n5",  note: "3 (truncated)" }
  - { stdin: "20\n4",  note: "5 (exact)" }
  - { stdin: "3\n5",   note: "0 (smaller over larger)" }
  - { stdin: "100\n7", note: "14" }
