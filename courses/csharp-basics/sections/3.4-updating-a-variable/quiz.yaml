# Checkpoint quiz, machine-readable source of truth (quiz.md is the human mirror).
# The UI auto-grades from THIS file.
#
# Question types:
#   truefalse  -> answer: true | false
#   mcq        -> options list; answer: the id of the correct option
#   fillblank  -> accept: list of accepted answers (case-insensitive, trimmed)
#
# Scope: 3.4 (++ / --, compound assignment += -= *= /= %=, shorthand equivalence,
# prefix vs postfix named). Assumes Ch.1-2, 3.1-3.3.

section: csharp-basics/3.4-updating-a-variable
pass: 5            # need >= 5 of 7 to clear the comprehension gate
shuffle: true

questions:
  - id: q1
    type: mcq
    prompt: "After `int count = 5; count++;`, what is `count`?"
    options:
      - { id: a, text: "6" }
      - { id: b, text: "5" }
      - { id: c, text: "7" }
      - { id: d, text: "4" }
    answer: a
    rationale: "count++ adds one, the same as count = count + 1, so count becomes 6."

  - id: q2
    type: mcq
    prompt: "What is `total += 7` shorthand for?"
    options:
      - { id: a, text: "total = total + 7" }
      - { id: b, text: "total = 7" }
      - { id: c, text: "total + 7 (without storing it)" }
      - { id: d, text: "total = 7 + 7" }
    answer: a
    rationale: "Compound assignment updates the variable from its own value: total = total + 7."

  - id: q3
    type: truefalse
    prompt: "`x += y` and `x = x + y` produce the same result."
    answer: true
    rationale: "The compound form is shorthand for the long form; they do exactly the same thing."

  - id: q4
    type: mcq
    prompt: "After `int z = 17; z /= 5;` (both whole numbers), what is `z`?"
    options:
      - { id: a, text: "3" }
      - { id: b, text: "3.4" }
      - { id: c, text: "4" }
      - { id: d, text: "2" }
    answer: a
    rationale: "/= uses whole-number division, which truncates: 17 / 5 is 3, stored back in z."

  - id: q5
    type: mcq
    prompt: "What does `rate *= 2` do to `rate`?"
    options:
      - { id: a, text: "doubles it (rate = rate * 2)" }
      - { id: b, text: "adds 2 to it" }
      - { id: c, text: "sets it to 2" }
      - { id: d, text: "it does not compile" }
    answer: a
    rationale: "*= multiplies the variable by the value and stores the result: rate = rate * 2."

  - id: q6
    type: truefalse
    prompt: "On its own line, `x++` and `++x` have the same effect on `x`."
    answer: true
    rationale: "As a standalone statement both add one. The prefix/postfix difference only shows when you use the result in the same expression."

  - id: q7
    type: fillblank
    prompt: "Fill the compound operator that adds amount to total:  total ___ amount;"
    accept: ["+="]
    rationale: "total += amount adds amount to total in place."
