id: p07-negative-remainder
title: Negative remainder
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b (a may be negative); print a % b. Sign of the result follows the dividend (left operand).
cases:
  - { stdin: "-7\n3",  note: "-1 (sign from -7)" }
  - { stdin: "7\n-3",  note: "1 (sign from 7)" }
  - { stdin: "-10\n5", note: "0 (exact)" }
  - { stdin: "-8\n3",  note: "-2" }
