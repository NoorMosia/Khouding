id: p05-last-two-digits
title: Last two digits
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n; print n % 100 (last two digits). Includes n < 100 (whole number) and a trailing-zero case.
cases:
  - { stdin: "1234", note: "34" }
  - { stdin: "5",    note: "5 (less than 100, whole number)" }
  - { stdin: "900",  note: "0 (ends in 00)" }
  - { stdin: "4087", note: "87" }
