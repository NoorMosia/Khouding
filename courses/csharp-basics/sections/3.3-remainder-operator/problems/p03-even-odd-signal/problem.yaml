id: p03-even-odd-signal
title: Even or odd signal
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n; print n % 2 (0 even, 1 odd). The signal, not the word (deciding on it is Ch.4).
cases:
  - { stdin: "8",  note: "0 (even)" }
  - { stdin: "9",  note: "1 (odd)" }
  - { stdin: "0",  note: "0 (even)" }
  - { stdin: "17", note: "1 (odd)" }
