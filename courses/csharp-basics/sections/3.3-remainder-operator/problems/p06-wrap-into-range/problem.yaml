id: p06-wrap-into-range
title: Wrap into a range
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read value and size; print value % size (wraps into 0..size-1).
cases:
  - { stdin: "7\n3",   note: "1 (wrapped)" }
  - { stdin: "3\n3",   note: "0 (lands on size, wraps to 0)" }
  - { stdin: "2\n5",   note: "2 (already in range)" }
  - { stdin: "14\n12", note: "2 (clock-style wrap)" }
