id: p02-read-remainder
title: Read a remainder
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print a % b. Varied inputs incl. exact-divide (remainder 0) and a < b.
cases:
  - { stdin: "7\n3",   note: "1" }
  - { stdin: "10\n2",  note: "0 (even, exact)" }
  - { stdin: "4\n9",   note: "4 (a < b, remainder is a)" }
  - { stdin: "100\n7", note: "2" }
