id: p13-fix-max-seed
title: Fix the max seed
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter seeds max at 0 (wrong for all-negative). Fix: seed from a[0]. Include all-negative case.
cases:
  - { stdin: "4\n4\n9\n2\n7", note: "positive: 9 (both versions agree here)" }
  - { stdin: "3\n-5\n-2\n-9", note: "all negative: -2 (0 seed wrongly gives 0)" }
  - { stdin: "1\n-7", note: "edge - single negative: -7" }
  - { stdin: "4\n-1\n-1\n-1\n-1", note: "all equal negative: -1" }
