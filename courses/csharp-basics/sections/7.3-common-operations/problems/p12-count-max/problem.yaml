id: p12-count-max
title: Count the maximum
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Find max, count its occurrences. n >= 1. Vary: unique max, repeated max, all equal, length 1.
cases:
  - { stdin: "4\n4\n9\n2\n7", note: "unique max 9: count 1" }
  - { stdin: "5\n3\n9\n9\n1\n9", note: "max 9 appears 3 times" }
  - { stdin: "3\n5\n5\n5", note: "all equal: count 3" }
  - { stdin: "1\n7", note: "edge - length 1: count 1" }
