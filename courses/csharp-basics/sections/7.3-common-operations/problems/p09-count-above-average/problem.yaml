id: p09-count-above-average
title: Count above the average
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two passes: average, then count x > average. n >= 1. Vary spread; include an equal-to-average case.
cases:
  - { stdin: "4\n1\n2\n3\n10", note: "average 4: one above (10)" }
  - { stdin: "3\n5\n5\n5", note: "all equal average 5: none strictly above" }
  - { stdin: "5\n1\n2\n3\n4\n5", note: "average 3: two above (4,5)" }
  - { stdin: "1\n7", note: "edge - length 1: average 7, none above" }
