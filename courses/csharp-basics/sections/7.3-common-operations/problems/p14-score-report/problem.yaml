# Capstone: four-line labelled report (count/sum/average/max). n >= 1. Include a fractional average.
cases:
  - { stdin: "4\n10\n20\n30\n40", note: "average 25 (whole)" }
  - { stdin: "3\n1\n2\n2", note: "fractional average 1.6666666666666667" }
  - { stdin: "1\n99", note: "edge - length 1" }
  - { stdin: "5\n50\n50\n50\n50\n50", note: "all equal: average 50" }
