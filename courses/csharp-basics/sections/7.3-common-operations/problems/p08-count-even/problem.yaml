id: p08-count-even
title: Count the evens
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count elements with x % 2 == 0. Vary; include 0 (even), negatives (even by % test), length 0.
cases:
  - { stdin: "5\n1\n2\n3\n4\n6", note: "three evens" }
  - { stdin: "3\n1\n3\n5", note: "none even" }
  - { stdin: "4\n0\n-2\n-4\n7", note: "zero and negatives even: three" }
  - { stdin: "0", note: "edge - length 0: count 0" }
