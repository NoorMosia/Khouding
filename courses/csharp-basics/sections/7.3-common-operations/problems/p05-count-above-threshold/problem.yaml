id: p05-count-above-threshold
title: Count above a threshold
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count elements strictly > threshold. Vary so none/some/all pass; include length 0.
cases:
  - { stdin: "4\n3\n8\n1\n10\n5", note: "two above 5" }
  - { stdin: "3\n1\n2\n3\n10", note: "none above 10" }
  - { stdin: "3\n7\n8\n9\n0", note: "all above 0" }
  - { stdin: "0\n5", note: "edge - length 0: count 0" }
