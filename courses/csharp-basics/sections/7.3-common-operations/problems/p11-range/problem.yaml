grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# max - min in one pass, both seeded from a[0]. n >= 1. Include all-equal (range 0) and negatives.
cases:
  - { stdin: "4\n4\n9\n2\n7", note: "9 - 2 = 7" }
  - { stdin: "3\n5\n5\n5", note: "all equal: range 0" }
  - { stdin: "4\n-5\n-2\n-9\n-1", note: "negatives: -1 - -9 = 8" }
  - { stdin: "1\n7", note: "edge - length 1: range 0" }
