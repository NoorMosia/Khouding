grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Running max seeded from a[0]. n >= 1. Include all-negative (proves non-zero seed) and length 1.
cases:
  - { stdin: "4\n4\n9\n2\n7", note: "max 9" }
  - { stdin: "3\n-5\n-2\n-9", note: "all negative: max -2 (0 seed would fail)" }
  - { stdin: "1\n42", note: "edge - length 1: 42" }
  - { stdin: "5\n3\n3\n3\n3\n3", note: "all equal: 3" }
