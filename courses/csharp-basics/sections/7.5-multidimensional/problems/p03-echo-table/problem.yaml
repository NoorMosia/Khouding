id: p03-echo-table
title: Echo as a table
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Fill row-major, print as a table (single space, no trailing). Vary both dims incl. 1xk and kx1.
cases:
  - { stdin: "2\n3\n1\n2\n3\n4\n5\n6", note: "2x3 table" }
  - { stdin: "1\n4\n7\n8\n9\n10", note: "1x4 (single row)" }
  - { stdin: "3\n1\n5\n6\n7", note: "3x1 (single column)" }
  - { stdin: "2\n2\n-1\n0\n3\n-4", note: "2x2 with negatives" }
