id: p10-row-totals
title: Row totals
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print each row then " | " then its total. Vary dims/values incl. 1xk and kx1 and negatives.
cases:
  - { stdin: "2\n3\n1\n2\n3\n4\n5\n6", note: "2x3: rows total 6 and 15" }
  - { stdin: "1\n4\n10\n20\n30\n40", note: "1x4 single row total 100" }
  - { stdin: "3\n1\n5\n6\n7", note: "3x1: each row total is the single cell" }
  - { stdin: "2\n2\n-1\n2\n-3\n4", note: "2x2 negatives" }
