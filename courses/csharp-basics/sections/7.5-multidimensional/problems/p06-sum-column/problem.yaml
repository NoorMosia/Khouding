id: p06-sum-column
title: Sum a column
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Sum a chosen column (fix col, loop rows). Vary dims and the column index; stay in bounds.
cases:
  - { stdin: "2\n3\n1\n2\n3\n4\n5\n6\n0", note: "col 0 of 2x3: 1+4 = 5" }
  - { stdin: "2\n3\n1\n2\n3\n4\n5\n6\n2", note: "col 2 of 2x3: 3+6 = 9" }
  - { stdin: "3\n2\n1\n1\n2\n2\n3\n3\n1", note: "col 1 of 3x2: 1+2+3 = 6" }
  - { stdin: "3\n1\n5\n6\n7\n0", note: "3x1 single column: 18" }
