id: p09-max-cell
title: Max cell
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Nested max seeded from grid[0,0]. rows,cols >= 1. Include all-negative (proves non-zero seed).
cases:
  - { stdin: "2\n3\n1\n8\n3\n10\n2\n9", note: "max 10" }
  - { stdin: "2\n2\n-5\n-2\n-9\n-1", note: "all negative: -1 (0 seed would fail)" }
  - { stdin: "1\n1\n7", note: "edge - 1x1: 7" }
  - { stdin: "3\n1\n4\n4\n4", note: "3x1 all equal: 4" }
