# Nested sum over every cell. Vary both dims; include negatives and a single-row/single-col shape.
cases:
  - { stdin: "2\n3\n1\n2\n3\n4\n5\n6", note: "2x3 sum 21" }
  - { stdin: "1\n4\n10\n20\n30\n40", note: "1x4 sum 100" }
  - { stdin: "3\n1\n5\n6\n7", note: "3x1 sum 18" }
  - { stdin: "2\n2\n-1\n2\n-3\n4", note: "2x2 negatives sum 2" }
