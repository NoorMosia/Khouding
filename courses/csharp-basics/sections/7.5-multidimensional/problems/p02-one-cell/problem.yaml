# Set grid[r,c] = value, print it back. Vary dims and the target cell (incl. corners); stay in bounds.
cases:
  - { stdin: "2\n3\n1\n2\n9", note: "last cell" }
  - { stdin: "2\n3\n0\n0\n5", note: "first cell" }
  - { stdin: "3\n1\n2\n0\n7", note: "kx1 grid, last row" }
  - { stdin: "1\n4\n0\n3\n-2", note: "1xk grid, last col, negative" }
