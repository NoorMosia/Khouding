id: p07-yes-no
title: Present, yes or no
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Contains -> branch printing "yes"/"no" (lowercase). Vary present/absent.
cases:
  - { stdin: "hello world\nworld", note: "yes" }
  - { stdin: "hello world\nmars", note: "no" }
  - { stdin: "abc\na", note: "yes" }
  - { stdin: "abc\nd", note: "no" }
