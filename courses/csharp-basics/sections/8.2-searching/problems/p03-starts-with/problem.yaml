id: p03-starts-with
title: Starts with a prefix
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read line + prefix, print StartsWith (True/False). Vary match/mismatch, case.
cases:
  - { stdin: "report.txt\nrep", note: "True" }
  - { stdin: "report.txt\nlog", note: "False" }
  - { stdin: "Hello\nhe", note: "case differs: False" }
  - { stdin: "abc\nabc", note: "whole string is a prefix: True" }
