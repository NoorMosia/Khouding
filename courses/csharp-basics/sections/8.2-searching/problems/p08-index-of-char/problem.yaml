id: p08-index-of-char
title: Index of a character
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read line + a char, print IndexOf(char) or -1. Vary position, absent, first-of-duplicates.
cases:
  - { stdin: "hello\nl", note: "first l at 2" }
  - { stdin: "hello\nh", note: "at 0" }
  - { stdin: "hello\nz", note: "absent: -1" }
  - { stdin: "banana\na", note: "first a at 1" }
