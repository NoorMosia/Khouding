id: p05-contains-char
title: Contains a character
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read line + a char (first char of 2nd line), print Contains(char). Vary present/absent/case.
cases:
  - { stdin: "hello\ne", note: "present: True" }
  - { stdin: "hello\nz", note: "absent: False" }
  - { stdin: "Hello\nh", note: "case differs: False" }
  - { stdin: "a b c\n ", note: "space present: True" }
