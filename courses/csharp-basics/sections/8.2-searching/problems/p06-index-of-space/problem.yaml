grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print IndexOf(' ') or -1. Vary where the first space is, and a no-space line.
cases:
  - { stdin: "hello world", note: "space at 5" }
  - { stdin: "nospace", note: "no space: -1" }
  - { stdin: " leading", note: "space at 0" }
  - { stdin: "a b c", note: "first space at 1" }
