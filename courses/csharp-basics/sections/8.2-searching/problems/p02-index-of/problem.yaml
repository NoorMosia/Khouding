id: p02-index-of
title: Index of a substring
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read line + substring, print IndexOf (or -1). Vary position (start/mid/end), absent, first-of-duplicates.
cases:
  - { stdin: "hello world\nworld", note: "index 6" }
  - { stdin: "hello world\nhello", note: "at start: 0" }
  - { stdin: "hello world\nxyz", note: "absent: -1" }
  - { stdin: "abcabc\nbc", note: "first occurrence: 1" }
