id: p03-position
title: Position of first match
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# break + counter: read count n, target, then n values. Print the 1-based position of the first value equal
# to the target, or 0 if none. break on the match.
cases:
  - { stdin: "4\n7\n2\n7\n9\n7", note: "first 7 at position 2" }
  - { stdin: "3\n5\n5\n1\n2",    note: "match at position 1" }
  - { stdin: "3\n8\n1\n2\n3",    note: "absent -> 0" }
  - { stdin: "4\n9\n1\n2\n3\n9", note: "match at position 4 (last)" }
