id: p11-inventory-capstone
title: Inventory capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone using BOTH controls: read count n, a threshold, then n quantities. Scan in order.
# Stop (break) at the first quantity that is 0 (out of stock). While scanning, count how many quantities are
# low (> 0 but < threshold), skipping (continue) the healthy ones (>= threshold). A quantity of 0 is NOT low.
# Print two lines: the low-stock count, then the 1-based position of the first out-of-stock item (0 if none).
cases:
  - { stdin: "5\n10\n12\n4\n8\n0\n3",  note: "scan 12(ok),4(low),8(low),0(stop@4); low=2, firstZero=4" }
  - { stdin: "3\n5\n6\n7\n8",          note: "all healthy, no zero; low=0, firstZero=0" }
  - { stdin: "4\n10\n0\n5\n5\n5",      note: "first item is 0; low=0, firstZero=1" }
  - { stdin: "3\n10\n2\n3\n4",         note: "all low, no zero; low=3, firstZero=0" }
  - { stdin: "4\n5\n5\n2\n9\n0",       note: "5(ok),2(low),9(ok),0(stop@4); low=1, firstZero=4" }
