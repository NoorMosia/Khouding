id: p04-sum-positives
title: Sum positives only
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# continue basics: read count n, then n values, sum only the positives (continue past the rest). Print the sum.
# Cases: none skipped (all positive), some skipped, all skipped (sum 0).
cases:
  - { stdin: "4\n3\n-1\n5\n-2", note: "sum positives 3+5 = 8" }
  - { stdin: "3\n1\n2\n3",      note: "none skipped -> 6" }
  - { stdin: "3\n-1\n-2\n-3",   note: "all skipped -> 0" }
  - { stdin: "4\n0\n4\n0\n6",   note: "zeros skipped (not positive) -> 10" }
