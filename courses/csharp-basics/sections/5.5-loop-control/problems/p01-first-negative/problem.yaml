id: p01-first-negative
title: First negative
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# break basics: read count n, then n values, print the first negative and break. If none, print "none".
# Cases: match first pass, match late, never (prints none). Read all n even after break (consume input) is NOT
# required since the runner feeds stdin; stopping early is fine.
cases:
  - { stdin: "4\n5\n-3\n8\n-1", note: "first negative is -3 (found late)" }
  - { stdin: "3\n-7\n2\n4",     note: "first value negative (found first pass) -> -7" }
  - { stdin: "3\n1\n2\n3",      note: "no negative -> none" }
  - { stdin: "1\n-9",           note: "single negative -> -9" }
