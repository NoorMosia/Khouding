id: p05-count-evens
title: Count evens
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# continue + count: read count n, then n values, count the evens (continue past odds). Print the count.
# Cases: none skipped (all even), some, all skipped (all odd -> 0).
cases:
  - { stdin: "5\n2\n3\n4\n7\n6", note: "evens 2,4,6 -> 3" }
  - { stdin: "3\n2\n4\n6",       note: "all even -> 3" }
  - { stdin: "3\n1\n3\n5",       note: "all odd -> 0" }
  - { stdin: "4\n0\n1\n2\n3",    note: "0 is even -> evens 0,2 -> 2" }
