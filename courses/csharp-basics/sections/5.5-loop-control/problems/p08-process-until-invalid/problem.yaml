id: p08-process-until-invalid
title: Process until invalid
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# guard + break: read count n, then n values. Echo each value while it is positive; at the first value that is
# zero or negative, print "stopped" and break. If all are positive, no "stopped" line.
cases:
  - { stdin: "5\n3\n7\n-2\n9\n1", note: "echo 3,7 then -2 is invalid -> stopped" }
  - { stdin: "3\n1\n2\n3",        note: "all valid -> echo 1 2 3, no stopped line" }
  - { stdin: "2\n-5\n4",          note: "first value invalid -> stopped immediately (nothing echoed)" }
  - { stdin: "3\n4\n0\n9",        note: "0 is invalid -> echo 4 then stopped" }
