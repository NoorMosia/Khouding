id: p10-fix-break-vs-continue
title: Fix break vs continue
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Debug: should sum positives across all n values (skip non-positives). Starter uses break, so it stops at the
# first non-positive instead of skipping. Fix break -> continue. Cases distinguish stop vs skip.
cases:
  - { stdin: "5\n3\n-1\n5\n-2\n4", note: "skip -1,-2: 3+5+4 = 12 (buggy break stops after 3 -> 3)" }
  - { stdin: "3\n1\n2\n3",         note: "no skips -> 6 (same either way)" }
  - { stdin: "4\n-1\n2\n3\n4",     note: "first is non-positive: skip it -> 9 (buggy -> 0)" }
  - { stdin: "3\n-1\n-2\n-3",      note: "all skipped -> 0" }
