id: p07-total-crosses-limit
title: Stop when total crosses a limit
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# break on an accumulator: read count n, a limit, then n values. Add them in order; the moment the running
# total exceeds the limit, print the running total and break. If it never exceeds, print the final total.
cases:
  - { stdin: "5\n10\n4\n3\n5\n9\n1", note: "4,7,12 -> exceeds 10 at 12, print 12 and stop" }
  - { stdin: "3\n100\n10\n20\n30",   note: "never exceeds 100 -> final total 60" }
  - { stdin: "2\n5\n9\n1",           note: "first value 9 already exceeds 5 -> 9" }
  - { stdin: "4\n0\n1\n2\n3\n4",     note: "limit 0: first running total 1 exceeds -> 1" }
