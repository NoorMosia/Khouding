id: p06-skip-marker
title: Skip a marker value
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# continue on a marker: read count n, then n values, sum them but continue past any value equal to -1 (a
# marker that is NOT a stop, the loop runs all n). Print the sum.
cases:
  - { stdin: "5\n4\n-1\n6\n-1\n2", note: "sum skipping -1 markers: 4+6+2 = 12" }
  - { stdin: "3\n1\n2\n3",         note: "no markers -> 6" }
  - { stdin: "3\n-1\n-1\n-1",      note: "all markers -> 0" }
  - { stdin: "4\n10\n0\n-1\n5",    note: "0 is kept (only -1 skipped): 10+0+5 = 15" }
