id: p09-while-true-sum
title: while (true) with break
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# break out of while(true): read numbers in a while(true), break on 0, sum the values before it. Print the sum.
# The 0 (quit) always arrives, so the loop terminates. First value 0 -> sum 0.
cases:
  - { stdin: "5\n3\n2\n0", note: "5+3+2 = 10, break on 0" }
  - { stdin: "0",          note: "quit immediately -> 0" }
  - { stdin: "7\n0",       note: "one value -> 7" }
  - { stdin: "4\n-6\n0",   note: "4 + (-6) = -2" }
