id: p04-read-index
title: Element at a read index
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n values, then an index (0..n-1), print list[index]. Vary index (first/mid/last).
cases:
  - { stdin: "4\n10\n20\n30\n40\n1", note: "20" }
  - { stdin: "4\n10\n20\n30\n40\n0", note: "first: 10" }
  - { stdin: "4\n10\n20\n30\n40\n3", note: "last: 40" }
  - { stdin: "3\n7\n8\n9\n2", note: "9" }
