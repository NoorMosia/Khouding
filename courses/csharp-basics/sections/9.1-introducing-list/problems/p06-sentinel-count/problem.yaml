id: p06-sentinel-count
title: Sentinel build count
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read until "stop", print count. Vary: several, one, zero values before stop.
cases:
  - { stdin: "10\n20\n30\nstop", note: "3" }
  - { stdin: "7\nstop", note: "1" }
  - { stdin: "stop", note: "0 values before stop" }
  - { stdin: "1\n2\n3\n4\n5\nstop", note: "5" }
