# Sentinel build; print the last value added. At least 1 value before stop.
cases:
  - { stdin: "10\n20\n30\nstop", note: "30" }
  - { stdin: "99\nstop", note: "one value: 99" }
  - { stdin: "1\n2\n3\n4\nstop", note: "4" }
  - { stdin: "-5\nstop", note: "-5" }
