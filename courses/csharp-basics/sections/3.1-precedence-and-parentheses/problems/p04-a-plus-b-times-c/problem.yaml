grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b, c; print a + b * c (* before +). Three varied inputs.
cases:
  - { stdin: "2\n3\n4",  note: "2 + 12 = 14" }
  - { stdin: "0\n5\n6",  note: "0 + 30 = 30" }
  - { stdin: "9\n2\n0",  note: "c zero, 9 + 0 = 9" }
  - { stdin: "5\n5\n5",  note: "5 + 25 = 30" }
