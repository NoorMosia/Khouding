id: p10-ticket-total
title: Ticket total
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: (adults + children) * price + fee. Needs parentheses for the people sum, then * price, then + fee.
cases:
  - { stdin: "2\n3\n10\n5",  note: "(5) * 10 + 5 = 55" }
  - { stdin: "1\n0\n20\n0",  note: "(1) * 20 + 0 = 20, no fee no children" }
  - { stdin: "0\n4\n8\n3",   note: "(4) * 8 + 3 = 35, adults zero" }
  - { stdin: "5\n5\n12\n10", note: "(10) * 12 + 10 = 130" }
