id: p09-fix-the-precedence
title: Fix the precedence
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter computes base + extra * people but should charge (base + extra) per person: (base + extra) * people.
# No compiler error; it just computes the wrong value. Fix with parentheses.
cases:
  - { stdin: "10\n2\n4",  note: "(12) * 4 = 48; buggy would be 10 + 8 = 18" }
  - { stdin: "5\n5\n2",   note: "(10) * 2 = 20" }
  - { stdin: "0\n3\n5",   note: "(3) * 5 = 15" }
  - { stdin: "20\n0\n3",  note: "extra zero, (20) * 3 = 60" }
