id: p03-read-mixed
title: Read and mix
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a and b, print a + b * 2 (* binds before +). Varied inputs defeat a hardcoded literal.
cases:
  - { stdin: "3\n4",   note: "3 + 8 = 11" }
  - { stdin: "0\n5",   note: "0 + 10 = 10" }
  - { stdin: "10\n0",  note: "b zero, 10 + 0 = 10" }
  - { stdin: "7\n6",   note: "7 + 12 = 19" }
