# Checkpoint quiz, machine-readable source of truth (quiz.md is the human mirror).
# The UI auto-grades from THIS file.
#
# Question types:
#   truefalse  -> answer: true | false
#   mcq        -> options list; answer: the id of the correct option
#   fillblank  -> accept: list of accepted answers (case-insensitive, trimmed)
#
# Scope: 3.1 (precedence of + - * / %, parentheses override, left-to-right among
# equal precedence). Assumes Ch.1-2. Uses whole-number arithmetic only.

section: csharp-basics/3.1-precedence-and-parentheses
pass: 5            # need >= 5 of 7 to clear the comprehension gate
shuffle: true

questions:
  - id: q1
    type: mcq
    prompt: "What is the value of `2 + 3 * 4`?"
    options:
      - { id: a, text: "14" }
      - { id: b, text: "20" }
      - { id: c, text: "24" }
      - { id: d, text: "9" }
    answer: a
    rationale: "* binds tighter than +, so 3 * 4 is done first (12), then 2 + 12 = 14."

  - id: q2
    type: mcq
    prompt: "What is the value of `(2 + 3) * 4`?"
    options:
      - { id: a, text: "20" }
      - { id: b, text: "14" }
      - { id: c, text: "24" }
      - { id: d, text: "9" }
    answer: a
    rationale: "Parentheses are done first: 2 + 3 = 5, then 5 * 4 = 20."

  - id: q3
    type: truefalse
    prompt: "`*` and `/` are applied before `+` and `-`."
    answer: true
    rationale: "Multiplication, division, and remainder have higher precedence than addition and subtraction."

  - id: q4
    type: mcq
    prompt: "What is the value of `10 - 4 + 3`?"
    options:
      - { id: a, text: "9" }
      - { id: b, text: "3" }
      - { id: c, text: "11" }
      - { id: d, text: "-9" }
    answer: a
    rationale: "+ and - have equal precedence, so it goes left to right: (10 - 4) + 3 = 9, not 10 - (4 + 3)."

  - id: q5
    type: mcq
    prompt: "How do you force the addition in `a + b * c` to happen before the multiplication?"
    options:
      - { id: a, text: "put parentheses around it: (a + b) * c" }
      - { id: b, text: "you cannot change the order" }
      - { id: c, text: "write the + on its own line" }
      - { id: d, text: "swap it to b * c + a" }
    answer: a
    rationale: "Parentheses override the default order; whatever is inside them is evaluated first."

  - id: q6
    type: truefalse
    prompt: "A program with the operators in the wrong order (missing parentheses) will fail to compile."
    answer: false
    rationale: "A precedence mistake compiles and runs; it just computes the wrong value. There is no error message, so you check the order yourself."

  - id: q7
    type: fillblank
    prompt: "Fill the blank so the result is 20, not 14:  ____ * 4   (use 2 and 3 with +)"
    accept: ["(2 + 3)", "(2+3)"]
    rationale: "Wrapping the addition, (2 + 3) * 4, forces it first and gives 20."
