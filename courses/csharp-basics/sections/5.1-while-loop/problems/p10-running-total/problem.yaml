id: p10-running-total
title: Running total
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Per-iteration output: read count c, then c numbers, after each read print the running total so far
# (one line per read). c = 0 -> no total lines. Count pattern with output inside the loop.
cases:
  - { stdin: "3\n5\n2\n4", note: "running: 5, 7, 11" }
  - { stdin: "1\n9",       note: "single: 9" }
  - { stdin: "0",          note: "zero iterations: no total lines" }
  - { stdin: "4\n2\n-3\n1\n5", note: "running: 2, -1, 0, 5" }
