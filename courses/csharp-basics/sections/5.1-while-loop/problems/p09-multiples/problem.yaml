id: p09-multiples
title: Multiples
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Stepped loop: read n and k, print k, 2k, 3k, ... up to and including n, one per line.
# Zero case: n < k prints nothing. k assumed >= 1.
cases:
  - { stdin: "10\n3", note: "3 6 9 (12 > 10 stops)" }
  - { stdin: "10\n5", note: "5 10 (10 included)" }
  - { stdin: "4\n5",  note: "n < k: nothing (zero iterations)" }
  - { stdin: "7\n1",  note: "1..7 one per line" }
  - { stdin: "12\n4", note: "4 8 12" }
