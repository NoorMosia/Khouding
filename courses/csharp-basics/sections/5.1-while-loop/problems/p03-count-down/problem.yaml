id: p03-count-down
title: Count down
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Decrement: read n, print n, n-1, ..., 1 one per line. Zero/negative -> nothing.
cases:
  - { stdin: "4", note: "4 3 2 1" }
  - { stdin: "1", note: "just 1" }
  - { stdin: "0", note: "zero iterations: nothing" }
  - { stdin: "-3", note: "negative: nothing" }
