id: p04-sum-n-reads
title: Sum n reads
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count pattern: read count c, then read c numbers, print their sum. c = 0 -> 0 (zero iterations).
cases:
  - { stdin: "3\n5\n7\n2", note: "sum of 3 reads: 5+7+2 = 14" }
  - { stdin: "1\n9",       note: "one value -> 9" }
  - { stdin: "0",          note: "zero iterations -> 0 (no values read)" }
  - { stdin: "4\n1\n-2\n3\n-1", note: "negatives: 1-2+3-1 = 1" }
