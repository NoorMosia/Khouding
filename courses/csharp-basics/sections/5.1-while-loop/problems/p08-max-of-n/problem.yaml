id: p08-max-of-n
title: Max of n
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Running max: read count c (>= 1), then c numbers, print the largest. Seed max from the first read.
# Cases vary which position holds the max; include one value, negatives, and a duplicate max.
cases:
  - { stdin: "4\n3\n9\n2\n7",  note: "max is 9 (not first, not last)" }
  - { stdin: "1\n5",           note: "single value -> 5" }
  - { stdin: "3\n-4\n-1\n-9",  note: "all negative -> -1" }
  - { stdin: "3\n6\n6\n2",     note: "duplicate max -> 6" }
  - { stdin: "2\n8\n8",        note: "two equal -> 8" }
