id: p06-sum-until-zero
title: Sum until zero
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Sentinel pattern: read ints until 0, print the total of the values before the 0 (0 not counted).
# First value 0 -> zero iterations -> 0.
cases:
  - { stdin: "5\n3\n2\n0",  note: "5+3+2 = 10, stop at 0" }
  - { stdin: "0",           note: "sentinel first -> zero iterations -> 0" }
  - { stdin: "7\n0",        note: "one value -> 7" }
  - { stdin: "4\n-6\n2\n0", note: "negatives before sentinel: 4-6+2 = 0" }
