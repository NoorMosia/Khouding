id: p02-sum-to-n
title: Sum to n
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Accumulate a total: read n, print the sum 1+2+...+n. Zero case -> 0.
cases:
  - { stdin: "4", note: "1+2+3+4 = 10" }
  - { stdin: "1", note: "one term -> 1" }
  - { stdin: "0", note: "zero iterations -> 0" }
  - { stdin: "10", note: "1..10 -> 55" }
