id: p05-count-positives
title: Count positives
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Count pattern + condition: read c, then c numbers, print how many are > 0. c = 0 -> 0.
cases:
  - { stdin: "4\n3\n-1\n5\n0", note: "positives among 3,-1,5,0 -> 2" }
  - { stdin: "3\n-2\n-5\n-1",  note: "none positive -> 0" }
  - { stdin: "3\n1\n2\n3",     note: "all positive -> 3" }
  - { stdin: "0",              note: "zero iterations -> 0" }
  - { stdin: "1\n7",           note: "one positive -> 1" }
