id: p02-join-two-read-words
title: Join two read words
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read two words, join with a space, print. The space is its own piece.
cases:
  - { stdin: "Hello\nthere",  note: typical }
  - { stdin: "good\nmorning", note: different words }
  - { stdin: "one\ntwo",      note: short words }
  - { stdin: "sea\nbreeze",   note: another pair }
