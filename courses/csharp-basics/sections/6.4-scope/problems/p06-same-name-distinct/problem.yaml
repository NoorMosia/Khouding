id: p06-same-name-distinct
title: Same name, distinct
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Main and a helper both use the name 'total' independently. Helper prints its own total (always 42);
# Main reads its own total and prints it. Two lines: helper's 42, then Main's read value.
cases:
  - { stdin: "5",  note: "42 then 5" }
  - { stdin: "0",  note: "42 then 0" }
  - { stdin: "99", note: "42 then 99" }
