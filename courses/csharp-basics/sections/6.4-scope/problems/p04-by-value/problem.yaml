grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# By-value observable: a method adds 100 to its parameter and prints it; Main then prints the ORIGINAL,
# which is unchanged. Two lines: the method's changed copy, then Main's unchanged value. Main reads the value.
cases:
  - { stdin: "5",  note: "105 then 5" }
  - { stdin: "0",  note: "100 then 0" }
  - { stdin: "-7", note: "93 then -7" }
  - { stdin: "40", note: "140 then 40" }
