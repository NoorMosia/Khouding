id: p08-reverse-words
title: Reverse word order
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Split, index down from Length-1. Vary count; include single word.
cases:
  - { stdin: "one two three", note: "three then two then one" }
  - { stdin: "hello", note: "single word: hello" }
  - { stdin: "a b c d", note: "d c b a" }
  - { stdin: "first last", note: "last then first" }
