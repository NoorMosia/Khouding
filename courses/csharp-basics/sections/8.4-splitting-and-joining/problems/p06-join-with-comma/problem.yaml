id: p06-join-with-comma
title: Join with a comma
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n then n words, join with ", ". Vary count including 1 (no comma).
cases:
  - { stdin: "3\none\ntwo\nthree", note: "one, two, three" }
  - { stdin: "1\nsolo", note: "single word: solo" }
  - { stdin: "2\nalpha\nbeta", note: "alpha, beta" }
  - { stdin: "4\na\nb\nc\nd", note: "a, b, c, d" }
