id: p09-join-read-sep
title: Join with a read separator
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n words, then sep; join with sep. Vary separator and word count.
cases:
  - { stdin: "3\none\ntwo\nthree\n-", note: "one-two-three" }
  - { stdin: "3\na\nb\nc\n | ", note: "a | b | c" }
  - { stdin: "1\nsolo\n,", note: "single word: solo" }
  - { stdin: "2\nhello\nworld\n...", note: "hello...world" }
