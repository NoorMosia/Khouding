id: p07-split-on-char
title: Split on a chosen separator
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Split on read sep char, print count. Vary separator, count; include sep absent (count 1).
cases:
  - { stdin: "a,b,c\n,", note: "3 pieces" }
  - { stdin: "a b c\n ", note: "3 pieces (space)" }
  - { stdin: "hello\n,", note: "sep absent: 1" }
  - { stdin: "a|b|c|d\n|", note: "4 pieces" }
