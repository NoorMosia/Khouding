id: p06-named-constants
title: Name the magic numbers
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read crates; print total bottles then total cost. 12 bottles/crate, 2 each,
# as named consts. Output unchanged by the rename; varied inputs resist hardcoding.
cases:
  - { stdin: "1",  note: one crate }
  - { stdin: "5",  note: normal }
  - { stdin: "0",  note: edge - zero }
  - { stdin: "10", note: larger }
