id: p04-reassign-a-value
title: Reassign a value
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two lines in: first value, then the value it is reassigned to. Only the
# second should print (the first is overwritten).
cases:
  - { stdin: "10\n25", note: normal; 10 overwritten by 25 }
  - { stdin: "5\n0",   note: edge - reassigned to zero }
  - { stdin: "-3\n-9", note: edge - negatives }
  - { stdin: "7\n7",   note: reassigned to same value }
