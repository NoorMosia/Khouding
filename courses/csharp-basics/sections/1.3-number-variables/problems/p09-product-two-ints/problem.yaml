id: p09-product-two-ints
title: Product of two ints
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
cases:
  - { stdin: "3\n4",   note: normal }
