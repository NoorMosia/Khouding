id: p12-swap-two-values
title: Swap two values
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; swap via a temp; print a then b (swapped).
cases:
  - { stdin: "1\n2",   note: normal }
  - { stdin: "5\n5",   note: equal values }
  - { stdin: "-3\n8",  note: negatives }
  - { stdin: "0\n42",  note: edge - zero }
