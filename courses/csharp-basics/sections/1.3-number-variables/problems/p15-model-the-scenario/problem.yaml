id: p15-model-the-scenario
title: Model the scenario
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Integrative: int qty, double unit price, const delivery fee. Print subtotal
# (qty * price) then total (subtotal + fee). Prices chosen to print cleanly.
cases:
  - { stdin: "3\n2.5",  note: normal; subtotal 7.5, total 12.5 (fee 5) }
  - { stdin: "1\n10",   note: single item, whole price }
  - { stdin: "0\n9.99", note: edge - zero quantity; subtotal 0, total 5 }
  - { stdin: "4\n1.25", note: subtotal 5, total 10 }
