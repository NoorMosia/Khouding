# Checkpoint quiz, machine-readable source of truth (quiz.md is the human mirror).
# The UI auto-grades from THIS file.
#
# Question types:
#   truefalse  -> answer: true | false
#   mcq        -> options list; answer: the id of the correct option
#   fillblank  -> accept: list of accepted answers (case-insensitive, trimmed)
#
# Scope: 1.3 (int/double, choosing the type, =, reassignment, const, + - *).
# Assumes 1.1-1.2.

section: csharp-basics/1.3-number-variables
pass: 5            # need >= 5 of 7 to clear the comprehension gate
shuffle: true

questions:
  - id: q1
    type: mcq
    prompt: "Which type best fits the price of a coffee?"
    options:
      - { id: a, text: "int" }
      - { id: b, text: "double" }
      - { id: c, text: "either works equally well" }
      - { id: d, text: "neither can hold a price" }
    answer: b
    rationale: "A price can be fractional, so double."

  - id: q2
    type: mcq
    prompt: "Which type best fits the number of students in a class?"
    options:
      - { id: a, text: "int" }
      - { id: b, text: "double" }
      - { id: c, text: "a text type" }
      - { id: d, text: "either, it does not matter" }
    answer: a
    rationale: "A count of students is always a whole number, so int."

  - id: q3
    type: truefalse
    prompt: "In `int x = 5;` the `=` tests whether x equals 5."
    answer: false
    rationale: "`=` stores a value. Read it \"x gets 5\", not \"x equals 5\"."

  - id: q4
    type: mcq
    prompt: |
      After these two lines, what does score hold?
        int score = 10;
        score = 25;
    options:
      - { id: a, text: "10" }
      - { id: b, text: "25" }
      - { id: c, text: "35" }
      - { id: d, text: "an error: you cannot change a variable" }
    answer: b
    rationale: "Reassignment overwrites. The 10 is gone; score holds 25."

  - id: q5
    type: truefalse
    prompt: "A `const` can be reassigned a new value later in the program."
    answer: false
    rationale: "A const is fixed once set. Trying to reassign it does not compile."

  - id: q6
    type: fillblank
    prompt: "To create a whole-number variable called count starting at 0, write:  ____ count = 0;"
    accept: ["int"]
    rationale: "int is the whole-number type."

  - id: q7
    type: mcq
    prompt: "Why might `0.1 + 0.2` print as 0.30000000000000004?"
    options:
      - { id: a, text: "it is a bug in C#" }
      - { id: b, text: "double is approximate: it trades exactness for a huge range" }
      - { id: c, text: "you must use int for addition" }
      - { id: d, text: "the numbers are too large" }
    answer: b
    rationale: "double stores most decimals a hair off. That is normal, not a bug. int is exact; double is approximate."
