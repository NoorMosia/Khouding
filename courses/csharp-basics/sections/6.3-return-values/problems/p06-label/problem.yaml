id: p06-label
title: Pass or fail label
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Return a string: Label(score) returns "pass" if score >= 50 else "fail"; Main reads score and prints it.
cases:
  - { stdin: "75", note: "pass" }
  - { stdin: "50", note: "pass (boundary inclusive)" }
  - { stdin: "49", note: "fail" }
  - { stdin: "0",  note: "fail" }
