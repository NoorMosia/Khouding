grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Early return: ClampFloor(n) returns 0 early if n < 0, otherwise returns n. Main reads n and prints it.
cases:
  - { stdin: "5",  note: "5 (non-negative, returned as is)" }
  - { stdin: "0",  note: "0 (boundary, not negative)" }
  - { stdin: "-3", note: "0 (negative clamped to 0, early return)" }
  - { stdin: "-1", note: "0" }
