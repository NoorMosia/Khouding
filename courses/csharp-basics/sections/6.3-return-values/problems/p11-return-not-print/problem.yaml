id: p11-return-not-print
title: Return, do not print
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Return-vs-print: Triple(n) must RETURN n*3 (not print). Main prints Triple(n) on line 1, then
# Triple(n) + Triple(n) on line 2 (the doubled triple), which only works if Triple returns a value.
cases:
  - { stdin: "4",  note: "12 then 24" }
  - { stdin: "0",  note: "0 then 0" }
  - { stdin: "-2", note: "-6 then -12" }
  - { stdin: "5",  note: "15 then 30" }
