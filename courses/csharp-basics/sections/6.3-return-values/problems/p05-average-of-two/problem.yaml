id: p05-average-of-two
title: Average of two
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Return a double: AverageOfTwo(a,b) returns (a+b)/2.0 as a double; Main reads both and prints it.
# Verify the exact printed form under invariant culture (decimal point). Cases include a .5 result.
cases:
  - { stdin: "4\n6",  note: "5" }
  - { stdin: "3\n4",  note: "3.5" }
  - { stdin: "0\n0",  note: "0" }
  - { stdin: "5\n2",  note: "3.5" }
  - { stdin: "-3\n1", note: "-1" }
