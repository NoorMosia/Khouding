id: p14-max3-capstone
title: Max of three capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: a returning Max3(a,b,c) (built on a Larger helper) returns the largest of three; Main reads three
# numbers and prints the returned value. Position of the max varies across cases.
cases:
  - { stdin: "3\n9\n5",   note: "9 (middle)" }
  - { stdin: "9\n3\n5",   note: "9 (first)" }
  - { stdin: "3\n5\n9",   note: "9 (last)" }
  - { stdin: "-4\n-1\n-9", note: "-1 (all negative)" }
  - { stdin: "7\n7\n2",   note: "7 (tie at the top)" }
