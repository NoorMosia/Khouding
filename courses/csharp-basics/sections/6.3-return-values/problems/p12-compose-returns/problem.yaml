# Compose returns: print Larger(Square(a), Square(b)) where both are returning methods. Main reads a and b.
cases:
  - { stdin: "3\n4",  note: "Square 9,16 -> larger 16" }
  - { stdin: "-5\n2", note: "Square 25,4 -> larger 25" }
  - { stdin: "2\n2",  note: "Square 4,4 -> larger 4" }
  - { stdin: "0\n-1", note: "Square 0,1 -> larger 1" }
