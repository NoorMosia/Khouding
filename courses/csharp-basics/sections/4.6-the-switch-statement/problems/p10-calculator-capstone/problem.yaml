id: p10-calculator-capstone
title: Calculator capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Menu-driven switch: op 1 add, 2 subtract, 3 multiply, 4 average ((a+b)/2 integer). default "invalid op".
# Read op then a then b. Cases hit each op (varied a,b) and the default. Division is by the constant 2 (safe).
cases:
  - { stdin: "1\n6\n4",  note: "add -> 10" }
  - { stdin: "2\n6\n4",  note: "subtract -> 2" }
  - { stdin: "3\n6\n4",  note: "multiply -> 24" }
  - { stdin: "4\n6\n4",  note: "average (6+4)/2 -> 5" }
  - { stdin: "4\n7\n2",  note: "average (7+2)/2 = 9/2 -> 4 (integer division)" }
  - { stdin: "9\n1\n1",  note: "bad op -> invalid op (default)" }
  - { stdin: "2\n3\n10", note: "subtract negative result -> -7" }
