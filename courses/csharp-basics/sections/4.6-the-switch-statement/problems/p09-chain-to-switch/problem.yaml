id: p09-chain-to-switch
title: Chain to switch
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Convert an equality-only else-if chain on a string to a switch. red/green/yellow -> action, else "off".
cases:
  - { stdin: "red",    note: "stop" }
  - { stdin: "green",  note: "go" }
  - { stdin: "yellow", note: "slow" }
  - { stdin: "blue",   note: "unmatched -> off (default)" }
