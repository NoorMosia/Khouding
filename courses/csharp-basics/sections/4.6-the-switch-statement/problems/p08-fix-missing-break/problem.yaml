id: p08-fix-missing-break
title: Fix the missing break
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Debug: starter omits the break on case 1, which is a COMPILE error in C# (CS0163, no fall-through).
# The fix is adding break;. Cases hit each size and the default once it compiles.
cases:
  - { stdin: "1", note: "small" }
  - { stdin: "2", note: "medium" }
  - { stdin: "3", note: "large" }
  - { stdin: "4", note: "unknown size (default)" }
