id: p04-direction-code
title: Direction code
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# switch on a read string code -> full word, default "unknown". N/E/S/W plus an unmatched code.
cases:
  - { stdin: "N", note: "North" }
  - { stdin: "E", note: "East" }
  - { stdin: "S", note: "South" }
  - { stdin: "W", note: "West" }
  - { stdin: "X", note: "unmatched -> unknown (default)" }
