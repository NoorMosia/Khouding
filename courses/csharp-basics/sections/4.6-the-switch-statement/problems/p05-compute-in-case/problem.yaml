id: p05-compute-in-case
title: Compute in a case
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read option (1/2/3) and quantity. Each case sets a unit price and prints price*quantity (Ch.3 arithmetic).
# default -> "invalid option". Cases hit each option (different prices) and the default.
cases:
  - { stdin: "1\n4", note: "option 1 price 2, qty 4 -> 8" }
  - { stdin: "2\n3", note: "option 2 price 5, qty 3 -> 15" }
  - { stdin: "3\n2", note: "option 3 price 10, qty 2 -> 20" }
  - { stdin: "9\n5", note: "bad option -> invalid option (default), qty ignored" }
  - { stdin: "2\n0", note: "option 2, qty 0 -> 0" }
