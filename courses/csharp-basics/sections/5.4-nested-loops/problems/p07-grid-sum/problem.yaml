id: p07-grid-sum
title: Grid sum
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Accumulate across a nest: read n and m, sum r*c over all cells (r 1..n, c 1..m), print the total once.
cases:
  - { stdin: "2\n2", note: "1+2+2+4 = 9" }
  - { stdin: "1\n1", note: "single cell 1*1 = 1" }
  - { stdin: "3\n1", note: "1+2+3 = 6 (column)" }
  - { stdin: "1\n4", note: "1+2+3+4 = 10 (row)" }
  - { stdin: "3\n3", note: "sum of the 3x3 products = 36" }
