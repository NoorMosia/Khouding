# Outer-dependent inner bound: read n, print a right triangle of stars; row i has i stars. No separators.
cases:
  - { stdin: "4", note: "*, **, ***, ****" }
  - { stdin: "1", note: "single star" }
  - { stdin: "3", note: "*, **, ***" }
  - { stdin: "5", note: "five rows" }
