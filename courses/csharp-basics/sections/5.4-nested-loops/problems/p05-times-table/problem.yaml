# Grid of computed values: read n (rows) and m (cols), print row*col per cell, single space, no trailing space.
cases:
  - { stdin: "3\n3", note: "3x3 products table" }
  - { stdin: "1\n5", note: "one row: 1 2 3 4 5" }
  - { stdin: "4\n1", note: "one column: 1 / 2 / 3 / 4" }
  - { stdin: "2\n4", note: "2 rows of 4 products" }
