id: p10-checkerboard
title: Checkerboard
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read both bounds + inner condition: read n (rows) and m (cols), print a checkerboard.
# Cell is '#' when (row + col) is even, '.' otherwise. One char per cell, no separators. Top-left is '#'.
cases:
  - { stdin: "3\n3", note: "#.#/.#./#.#" }
  - { stdin: "1\n4", note: "one row #.#." }
  - { stdin: "4\n1", note: "one column #/./#/." }
  - { stdin: "2\n3", note: "#.#/.#." }
