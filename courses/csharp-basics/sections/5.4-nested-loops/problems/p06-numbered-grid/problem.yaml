id: p06-numbered-grid
title: Numbered grid
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two counters + a running number: read n (rows) and m (cols), fill the grid with 1,2,3,... across each row.
# Single space between cells in a row, no trailing space; a running counter spans the whole grid.
cases:
  - { stdin: "2\n3", note: "row1: 1 2 3; row2: 4 5 6" }
  - { stdin: "1\n4", note: "1 2 3 4" }
  - { stdin: "3\n1", note: "1 / 2 / 3" }
  - { stdin: "2\n2", note: "1 2 / 3 4" }
