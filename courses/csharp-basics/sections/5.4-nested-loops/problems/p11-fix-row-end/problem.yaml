id: p11-fix-row-end
title: Fix the row ending
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Debug: should print an n-by-m block of '*' (m per row). Starter uses WriteLine inside the inner loop,
# so each star lands on its own line. Fix: Write inside, WriteLine after the inner loop. Silent, terminating.
cases:
  - { stdin: "2\n3", note: "2 rows of 3 (buggy prints 6 single-star lines)" }
  - { stdin: "1\n4", note: "1 row of 4" }
  - { stdin: "3\n1", note: "3 rows of 1 (same either way, but other cases distinguish)" }
  - { stdin: "2\n2", note: "2 rows of 2" }
