# Inner prints a sequence: read n (rows) and m, print n rows each "1 2 ... m" (single space, no trailing space).
cases:
  - { stdin: "2\n3", note: "two rows of 1 2 3" }
  - { stdin: "1\n5", note: "one row 1 2 3 4 5" }
  - { stdin: "3\n1", note: "three rows each just 1 (no trailing space)" }
  - { stdin: "2\n4", note: "two rows of 1 2 3 4" }
