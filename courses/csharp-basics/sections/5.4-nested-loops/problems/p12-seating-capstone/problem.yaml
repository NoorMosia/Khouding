id: p12-seating-capstone
title: Seating capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Capstone: read rows and seats, print a seating chart. Each seat is labeled R{row}S{seat} (interpolation),
# single space between seats in a row, no trailing space. Vary both bounds incl. 1-by-k and k-by-1.
cases:
  - { stdin: "2\n3", note: "R1S1 R1S2 R1S3 / R2S1 R2S2 R2S3" }
  - { stdin: "1\n4", note: "one row R1S1..R1S4" }
  - { stdin: "3\n1", note: "three rows each one seat R1S1 / R2S1 / R3S1" }
  - { stdin: "2\n2", note: "R1S1 R1S2 / R2S1 R2S2" }
