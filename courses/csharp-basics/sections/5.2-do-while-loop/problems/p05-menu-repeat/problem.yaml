id: p05-menu-repeat
title: Menu repeat
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Menu loop with do-while: each pass print the menu, read a choice, print its label (or "bye" on quit=4),
# repeat while the choice is not 4. The menu always shows at least once.
cases:
  - { stdin: "1\n2\n4", note: "start, load, then bye on 4" }
  - { stdin: "4",       note: "quit immediately: menu shows once, then bye" }
  - { stdin: "3\n4",    note: "save then bye" }
  - { stdin: "9\n4",    note: "unknown choice then bye" }
