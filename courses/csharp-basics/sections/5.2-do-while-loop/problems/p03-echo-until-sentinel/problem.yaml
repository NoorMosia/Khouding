id: p03-echo-until-sentinel
title: Echo until sentinel
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# do-while with the sentinel checked at the end: read a value in the body, echo it if not the sentinel (0),
# loop while it is not 0. The read always happens at least once.
cases:
  - { stdin: "5\n8\n2\n0", note: "echoes 5 8 2, stops at 0" }
  - { stdin: "0",          note: "sentinel first: read once, echo nothing (0 not echoed)" }
  - { stdin: "7\n0",       note: "echoes 7" }
  - { stdin: "4\n-2\n0",   note: "echoes 4 and -2" }
