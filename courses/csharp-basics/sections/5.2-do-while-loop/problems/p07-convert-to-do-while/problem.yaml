id: p07-convert-to-do-while
title: Convert to do-while
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Convert the given while to a do-while with the same body. Required behavior is the do-while one:
# print the counter starting at 1 while i <= n, running at least once. n = 0 must print 1 (the difference).
cases:
  - { stdin: "3", note: "1 2 3" }
  - { stdin: "1", note: "just 1" }
  - { stdin: "0", note: "do-while runs once: prints 1 (a plain while would print nothing)" }
  - { stdin: "5", note: "1..5" }
