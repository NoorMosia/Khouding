id: p06-at-least-one-attempt
title: At least one attempt
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# At-least-once: read n (requested attempts), make at least one attempt. Count attempts with a do-while that
# repeats while attempts < n, then print the number of attempts made. n <= 1 (incl. 0, negative) -> 1.
cases:
  - { stdin: "5",  note: "5 attempts" }
  - { stdin: "1",  note: "1 attempt" }
  - { stdin: "0",  note: "zero requested, but at least one made -> 1" }
  - { stdin: "-3", note: "negative requested -> still 1" }
  - { stdin: "3",  note: "3 attempts" }
