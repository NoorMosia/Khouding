# Debug: starter's do-while has no trailing semicolon after the while condition -> CS1002 compile error.
# Add the semicolon. Then it prints 1..n with the do-while (n = 0 prints 1).
cases:
  - { stdin: "4", note: "1 2 3 4" }
  - { stdin: "1", note: "just 1" }
  - { stdin: "0", note: "do-while runs once: prints 1" }
  - { stdin: "3", note: "1 2 3" }
