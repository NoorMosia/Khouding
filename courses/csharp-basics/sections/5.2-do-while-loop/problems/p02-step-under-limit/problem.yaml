id: p02-step-under-limit
title: Step under a limit
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Guaranteed first pass: read start and limit, print the value, add 3, repeat while value < limit.
# Even when start is already >= limit, the first value still prints once.
cases:
  - { stdin: "0\n10", note: "0 3 6 9 (12 not < 10)" }
  - { stdin: "5\n5",  note: "start not < limit: still prints 5 once (guaranteed pass)" }
  - { stdin: "8\n3",  note: "start already past limit: still prints 8 once" }
  - { stdin: "1\n8",  note: "1 4 7" }
