id: p04-sum-until-quit
title: Sum until quit
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# do-while sentinel accumulate: read values until -1, sum the ones before it. -1 read inside body, not added.
cases:
  - { stdin: "5\n3\n2\n-1", note: "5+3+2 = 10" }
  - { stdin: "-1",          note: "quit first: read once, sum 0" }
  - { stdin: "0\n0\n-1",    note: "zeros are valid data, sum 0" }
  - { stdin: "9\n-1",       note: "one value: 9" }
  - { stdin: "4\n-6\n-1",   note: "4 + (-6) = -2" }
