id: p16-sum-positives
title: Sum positives
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E: continue to skip non-qualifying values. Read count n, then n values, sum only positives. Print the sum.
cases:
  - { stdin: "4\n3\n-1\n5\n-2", note: "3+5 = 8" }
  - { stdin: "3\n1\n2\n3",      note: "none skipped -> 6" }
  - { stdin: "3\n-1\n-2\n-3",   note: "all skipped -> 0" }
  - { stdin: "4\n0\n4\n0\n6",   note: "zeros skipped -> 10" }
