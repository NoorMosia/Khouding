# B: do-while. Read n, print the counter 1.. using a do-while while i <= n. n = 0 still prints 1 (one pass).
cases:
  - { stdin: "4", note: "1 2 3 4" }
  - { stdin: "1", note: "just 1" }
  - { stdin: "0", note: "do-while runs once -> 1" }
  - { stdin: "3", note: "1 2 3" }
