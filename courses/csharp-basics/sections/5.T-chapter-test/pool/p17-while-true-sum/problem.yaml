id: p17-while-true-sum
title: while (true) sum
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E: while(true) exited by break. Read numbers, break on 0, sum the values before it. First 0 -> 0.
cases:
  - { stdin: "5\n3\n2\n0", note: "10" }
  - { stdin: "0",          note: "quit immediately -> 0" }
  - { stdin: "7\n0",       note: "one value -> 7" }
  - { stdin: "4\n-6\n0",   note: "-2" }
