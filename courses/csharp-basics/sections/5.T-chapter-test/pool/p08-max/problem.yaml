# C: running max. Read count n (>= 1), then n values, print the largest. Seed from the first read.
cases:
  - { stdin: "4\n3\n9\n2\n7", note: "9" }
  - { stdin: "1\n5",          note: "5" }
  - { stdin: "3\n-4\n-1\n-9", note: "all negative -> -1" }
  - { stdin: "3\n6\n6\n2",    note: "duplicate max -> 6" }
