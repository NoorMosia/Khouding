id: p15-first-match
title: First match
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# E: break at the first match. Read count n, then n values, print the first that is above 100 and break.
# If none, print "none". Cases: match first, late, never.
cases:
  - { stdin: "4\n50\n120\n80\n200", note: "first above 100 is 120 (found late)" }
  - { stdin: "3\n150\n2\n4",        note: "first value matches -> 150" }
  - { stdin: "3\n1\n2\n3",          note: "none above 100 -> none" }
  - { stdin: "1\n999",              note: "single match -> 999" }
