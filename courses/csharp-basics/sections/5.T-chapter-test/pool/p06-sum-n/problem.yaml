# C: count pattern sum with a for. Read count n, then n values, print the sum. n = 0 -> 0.
cases:
  - { stdin: "3\n4\n4\n4",      note: "12" }
  - { stdin: "1\n100",          note: "100" }
  - { stdin: "0",               note: "zero iterations -> 0" }
  - { stdin: "5\n1\n1\n1\n1\n1", note: "5" }
