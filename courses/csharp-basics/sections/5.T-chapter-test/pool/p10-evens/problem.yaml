id: p10-evens
title: Evens up to n
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# C: stepped for. Read n, print 2,4,...,up to and including n, one per line. n < 2 -> nothing.
cases:
  - { stdin: "10", note: "2 4 6 8 10" }
  - { stdin: "9",  note: "2 4 6 8" }
  - { stdin: "1",  note: "nothing" }
  - { stdin: "2",  note: "just 2" }
