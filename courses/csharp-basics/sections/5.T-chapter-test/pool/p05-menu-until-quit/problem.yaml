id: p05-menu-until-quit
title: Menu until quit
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# B: do-while menu. Each pass print "Pick (1-3, 0 quit):", read a choice, print its label or "bye" on 0.
# Repeat while choice != 0. Menu always shows at least once.
cases:
  - { stdin: "1\n2\n0", note: "one, two, then bye" }
  - { stdin: "0",       note: "quit immediately: menu once then bye" }
  - { stdin: "3\n0",    note: "three then bye" }
  - { stdin: "9\n0",    note: "unknown then bye" }
