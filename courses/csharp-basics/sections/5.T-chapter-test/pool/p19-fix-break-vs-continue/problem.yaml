id: p19-fix-break-vs-continue
title: Fix break vs continue
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# F, fix: should sum positives across all n values (skip non-positives). Starter uses break, stopping at the
# first non-positive. Fix break -> continue. Silent, terminating.
cases:
  - { stdin: "5\n3\n-1\n5\n-2\n4", note: "skip -1,-2: 3+5+4 = 12 (buggy stops -> 3)" }
  - { stdin: "3\n1\n2\n3",         note: "no skips -> 6" }
  - { stdin: "4\n-1\n2\n3\n4",     note: "first non-positive skipped -> 9 (buggy -> 0)" }
  - { stdin: "3\n-1\n-2\n-3",      note: "all skipped -> 0" }
