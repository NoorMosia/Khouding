id: p03-sentinel-count
title: Count until stop
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# A: sentinel pattern. Read numbers until 0, print how many came before it (0 not counted). First 0 -> 0.
cases:
  - { stdin: "5\n8\n2\n0", note: "three values -> 3" }
  - { stdin: "0",          note: "sentinel first -> 0" }
  - { stdin: "7\n0",       note: "one value -> 1" }
  - { stdin: "4\n4\n4\n4\n0", note: "four values -> 4" }
