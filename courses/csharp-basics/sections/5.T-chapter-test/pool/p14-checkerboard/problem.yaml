id: p14-checkerboard
title: Checkerboard
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# D: grid chosen by an inner condition. Read n and m, print '#' when (row+col) even, '.' otherwise.
# Top-left is '#'. One char per cell, no separators.
cases:
  - { stdin: "3\n3", note: "#.#/.#./#.#" }
  - { stdin: "1\n4", note: "#.#." }
  - { stdin: "4\n1", note: "#/./#/." }
  - { stdin: "2\n3", note: "#.#/.#." }
