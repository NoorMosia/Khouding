# A: count pattern sum with a while. Read count n, then n values, print the sum. n = 0 -> 0.
cases:
  - { stdin: "3\n5\n7\n2",      note: "14" }
  - { stdin: "1\n9",            note: "9" }
  - { stdin: "0",               note: "zero iterations -> 0" }
  - { stdin: "4\n2\n-3\n1\n5",  note: "5" }
