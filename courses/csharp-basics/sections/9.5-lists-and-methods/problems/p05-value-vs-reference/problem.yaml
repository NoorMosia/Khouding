id: p05-value-vs-reference
title: Value versus reference contrast
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# int param unchanged; list element changed. Print both. Vary inputs.
cases:
  - { stdin: "5\n5", note: "n stays 5, list[0] becomes 6" }
  - { stdin: "0\n10", note: "0 stays 0, list[0] becomes 11" }
  - { stdin: "-3\n-1", note: "n stays -3, list[0] becomes 0" }
  - { stdin: "100\n7", note: "100 stays 100, list[0] becomes 8" }
