# AppendZeros adds via Add; caller sees Count increase. Vary n and zeros.
cases:
  - { stdin: "3\n1\n2\n3\n2", note: "3 then 5" }
  - { stdin: "0\n4", note: "0 then 4" }
  - { stdin: "2\n5\n6\n0", note: "2 then 2 (add 0 zeros)" }
  - { stdin: "1\n7\n3", note: "1 then 4" }
