# void RemoveNegatives mutates; caller prints remaining. Vary some/all/none negative.
cases:
  - { stdin: "5\n-3\n4\n0\n-1\n7", note: "4 0 7" }
  - { stdin: "3\n-1\n-2\n-3", note: "all removed: nothing" }
  - { stdin: "3\n1\n2\n3", note: "none removed: 1 2 3" }
  - { stdin: "0", note: "edge - nothing" }
