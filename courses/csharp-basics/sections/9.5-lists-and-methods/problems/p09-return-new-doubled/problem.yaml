id: p09-return-new-doubled
title: Return a new doubled list
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Doubled returns a NEW list; original unchanged. Print doubled then "---" then original.
cases:
  - { stdin: "3\n1\n2\n3", note: "2 4 6 --- 1 2 3" }
  - { stdin: "1\n5", note: "10 --- 5" }
  - { stdin: "0", note: "just ---" }
  - { stdin: "2\n-4\n0", note: "-8 0 --- -4 0" }
