id: p10-fix-wrong-order
title: Fix the wrong-order chain
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Starter tests the loosest condition (>= 50) first, so high scores wrongly print "mid".
# No compiler error; the output is just wrong. Fix: reorder tightest-first (>= 90, then >= 50, else low).
# Case 95 separates the two orders (buggy -> mid, fixed -> high). Boundaries 90 and 50 reach each band.
cases:
  - { stdin: "95", note: "high (buggy loosest-first would print mid)" }
  - { stdin: "90", note: "high (boundary)" }
  - { stdin: "50", note: "mid (boundary)" }
  - { stdin: "20", note: "low (final else)" }
