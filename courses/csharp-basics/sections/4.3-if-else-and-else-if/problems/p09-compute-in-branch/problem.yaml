id: p09-compute-in-branch
title: Compute in one branch
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Two-way: if quantity is 0 print "nothing to pack"; else compute boxes = (quantity + 9) / 10
# (integer division rounds down, so +9 rounds up a partial box) and print that number.
# Cases hit both branches, including the zero branch and a value that needs rounding up.
cases:
  - { stdin: "0",  note: "zero branch -> nothing to pack" }
  - { stdin: "10", note: "exactly one full box" }
  - { stdin: "11", note: "partial box rounds up to 2" }
  - { stdin: "95", note: "rounds up to 10" }
