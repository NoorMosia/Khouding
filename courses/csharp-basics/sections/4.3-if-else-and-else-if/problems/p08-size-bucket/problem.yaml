# Bucket a count into small/medium/large/huge via an else if chain. Cases hit each bucket.
cases:
  - { stdin: "3",   note: "small (< 10)" }
  - { stdin: "40",  note: "medium (10..99)" }
  - { stdin: "500", note: "large (100..999)" }
  - { stdin: "1000", note: "huge (>= 1000)" }
