id: p07-discount-tier
title: Discount tier
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# First-true-wins: spend >= 100 -> gold, else if >= 50 -> silver, else none.
# A value like 150 satisfies BOTH thresholds; first match (gold) wins.
cases:
  - { stdin: "150", note: "gold (matches both >=100 and >=50; first wins)" }
  - { stdin: "100", note: "gold (boundary)" }
  - { stdin: "60",  note: "silver" }
  - { stdin: "20",  note: "none" }
