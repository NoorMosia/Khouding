id: p04-replace
title: Replace
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Replace old with new; vary one occurrence, multiple, absent (returns original).
cases:
  - { stdin: "hello world\nworld\nthere", note: "one: hello there" }
  - { stdin: "aabbaa\naa\nx", note: "multiple: xbbx" }
  - { stdin: "hello\nz\ny", note: "absent: hello (unchanged)" }
  - { stdin: "a b c\n \n-", note: "spaces to hyphens: a-b-c" }
