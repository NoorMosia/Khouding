id: p08-immutability-show
title: The original is unchanged
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Print ToUpper then original. Shows immutability: original line 2 differs from upper line 1.
cases:
  - { stdin: "hello", note: "HELLO then hello" }
  - { stdin: "Hello World", note: "HELLO WORLD then Hello World" }
  - { stdin: "CAPS", note: "both same: CAPS then CAPS" }
  - { stdin: "mixed Case", note: "MIXED CASE then mixed Case" }
