id: p10-spaces-to-hyphens
title: Spaces to hyphens
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Replace(" ", "-"). Vary: multiple spaces, one space, no space (unchanged).
cases:
  - { stdin: "a b c", note: "a-b-c" }
  - { stdin: "hello world", note: "hello-world" }
  - { stdin: "nospaces", note: "no change: nospaces" }
  - { stdin: "one two three four", note: "one-two-three-four" }
