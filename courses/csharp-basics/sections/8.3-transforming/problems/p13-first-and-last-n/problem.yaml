id: p13-first-and-last-n
title: First N and last N
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Substring(0,n) then Substring(Length-n). n <= Length/2, always in bounds.
cases:
  - { stdin: "hello world\n3", note: "hel then rld" }
  - { stdin: "programming\n4", note: "prog then ming" }
  - { stdin: "abcdef\n2", note: "ab then ef" }
  - { stdin: "hello\n1", note: "h then o" }
