# E: Describe(int) prints "number: <n>", Describe(string) prints "text: <s>". Main reads an int and a word.
cases:
  - { stdin: "5\nhi",   note: "number: 5 / text: hi" }
  - { stdin: "0\nok",   note: "number: 0 / text: ok" }
  - { stdin: "-3\nyes", note: "number: -3 / text: yes" }
