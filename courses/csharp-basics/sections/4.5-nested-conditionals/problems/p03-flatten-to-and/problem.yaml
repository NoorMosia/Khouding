id: p03-flatten-to-and
title: Flatten to &&
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read two 0/1 flags (ticket, id). Print "enter" only when BOTH are 1, nothing otherwise.
# Task: express as a single if (ticket == 1 && id == 1). Cases cover all four combinations.
cases:
  - { stdin: "1\n1", note: "both -> enter" }
  - { stdin: "1\n0", note: "ticket only -> no output" }
  - { stdin: "0\n1", note: "id only -> no output" }
  - { stdin: "0\n0", note: "neither -> no output" }
