id: p01-positive-small-or-large
title: Positive, small or large
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Outer: n > 0 vs not. Inner (positive only): n > 100 -> "large positive" else "small positive".
# Cases reach every leaf: large positive, small positive, and not positive.
cases:
  - { stdin: "5",    note: "small positive leaf" }
  - { stdin: "250",  note: "large positive leaf" }
  - { stdin: "100",  note: "edge: 100 is not > 100 -> small positive" }
  - { stdin: "-4",   note: "outer else, not positive (inner never reached)" }
  - { stdin: "0",    note: "zero is not positive" }
