id: p10-fix-dangling-else
title: Fix the dangling else
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Intended: if (a==1) { if (b==1) print "both" } else print "not a".
# Starter is brace-less, so the else binds to the INNER if and prints "not a" when a=1,b=0 (wrong).
# Fix with braces so else belongs to the outer if. Cases reach all three intended outcomes.
cases:
  - { stdin: "1\n1", note: "a and b -> both" }
  - { stdin: "1\n0", note: "a but not b -> (nothing); buggy version prints 'not a'" }
  - { stdin: "0\n1", note: "not a -> not a" }
  - { stdin: "0\n0", note: "not a -> not a (b ignored)" }
