id: p02-in-range-then-half
title: In range, which half
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Outer: 1..100 inclusive vs out. Inner (in range): n <= 50 -> "low half" else "high half".
# Cases reach both inner leaves, the midpoint edge, and the out branch on each side.
cases:
  - { stdin: "20",  note: "in range, low half" }
  - { stdin: "80",  note: "in range, high half" }
  - { stdin: "50",  note: "edge: 50 <= 50 -> low half" }
  - { stdin: "51",  note: "just over midpoint -> high half" }
  - { stdin: "0",   note: "below range -> out" }
  - { stdin: "150", note: "above range -> out" }
