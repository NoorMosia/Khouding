id: p04-account-then-balance
title: Account, then balance
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Outer: hasAccount flag (0/1). Inner (only if account): balance < 0 -> "overdrawn" else "ok".
# No account -> "no account" (the balance question is meaningless without an account).
# Cases: account+negative, account+zero, account+positive, no-account (balance ignored).
cases:
  - { stdin: "1\n-50", note: "account, negative -> overdrawn" }
  - { stdin: "1\n0",   note: "account, zero -> ok (0 is not < 0)" }
  - { stdin: "1\n200", note: "account, positive -> ok" }
  - { stdin: "0\n-50", note: "no account -> no account (balance not asked)" }
  - { stdin: "0\n999", note: "no account, positive balance still -> no account" }
