id: p09-shipping-tree
title: Shipping tree
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Outer: weight band (<= 5 light, else heavy). Inner: zone (1 local, else far).
# Four leaves: light-local, light-far, heavy-local, heavy-far. Cases reach every leaf + the weight edge.
cases:
  - { stdin: "3\n1",  note: "light, zone 1 -> light local" }
  - { stdin: "3\n2",  note: "light, other zone -> light far" }
  - { stdin: "10\n1", note: "heavy, zone 1 -> heavy local" }
  - { stdin: "10\n2", note: "heavy, other zone -> heavy far" }
  - { stdin: "5\n1",  note: "weight edge: 5 is light -> light local" }
  - { stdin: "6\n2",  note: "just over edge -> heavy far" }
