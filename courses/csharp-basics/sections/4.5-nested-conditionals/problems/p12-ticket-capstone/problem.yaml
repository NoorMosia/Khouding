id: p12-ticket-capstone
title: Ticket capstone
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Multi-level: age < 5 -> "free". age 5..17 -> child; else adult. Within child/adult: weekend flag splits.
# Leaves: free, child weekday, child weekend, adult weekday, adult weekend. Cases reach each + the age edges.
cases:
  - { stdin: "3\n0",  note: "under 5 -> free (weekend flag ignored)" }
  - { stdin: "10\n0", note: "child, weekday -> child weekday" }
  - { stdin: "10\n1", note: "child, weekend -> child weekend" }
  - { stdin: "30\n0", note: "adult, weekday -> adult weekday" }
  - { stdin: "30\n1", note: "adult, weekend -> adult weekend" }
  - { stdin: "5\n1",  note: "age edge: 5 is child -> child weekend" }
  - { stdin: "18\n0", note: "age edge: 18 is adult -> adult weekday" }
