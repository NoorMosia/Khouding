id: p06-nonempty-all-letters
title: Non-empty and all letters
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Non-empty AND all letters. Empty -> False. Vary: all-letter, mixed, empty.
cases:
  - { stdin: "hello", note: "True" }
  - { stdin: "hello1", note: "has digit: False" }
  - { stdin: "", note: "empty: False" }
  - { stdin: "ABC", note: "uppercase letters: True" }
