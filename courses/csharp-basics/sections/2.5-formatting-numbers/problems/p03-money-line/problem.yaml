grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# A label plus a :F2 amount. No currency symbol (country-neutral, deterministic under invariant culture).
cases:
  - { stdin: "19.95", note: typical price }
  - { stdin: "7.5",   note: pads to 7.50 }
  - { stdin: "100",   note: whole shows as 100.00 }
  - { stdin: "0",     note: free, shows 0.00 }
