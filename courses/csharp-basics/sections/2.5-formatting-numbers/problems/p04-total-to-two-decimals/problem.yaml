id: p04-total-to-two-decimals
title: Total to two decimals
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Compute count * unit price, then format the total with :F2. Values chosen for clean, obvious results.
cases:
  - { stdin: "3\n2.5",  note: "pads to 7.50" }
  - { stdin: "2\n19.95", note: "gives 39.90" }
  - { stdin: "0\n9.99",  note: "count zero, 0.00" }
  - { stdin: "10\n1.5",  note: "gives 15.00" }
