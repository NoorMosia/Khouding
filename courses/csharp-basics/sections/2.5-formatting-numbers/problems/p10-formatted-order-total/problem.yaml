id: p10-formatted-order-total
title: Formatted order total
difficulty: 3
grading: stdout-match
languages: [csharp]
solution:
  csharp: [solution.cs]
starter:
  csharp: [starter.cs]
# Capstone: read, compute quantity * unit price - discount, print the total with :F2.
# Values chosen so the total is clean and the :F2 output is obvious.
cases:
  - { stdin: "2\n10.5\n1",  note: "discount applied, 20.00" }
  - { stdin: "3\n4\n0",     note: "no discount, 12.00" }
  - { stdin: "4\n2.25\n0.5", note: "clean decimal, 8.50" }
  - { stdin: "5\n9.99\n0",  note: "larger, 49.95" }
