id: p06-store-a-bool
title: Store a bool
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read n; store bool isPositive = n > 0; print it. Note: 0 is NOT positive (> is strict).
cases:
  - { stdin: "5",  note: "True" }
  - { stdin: "-3", note: "False" }
  - { stdin: "0",  note: "False (zero is not positive)" }
  - { stdin: "100", note: "True" }
