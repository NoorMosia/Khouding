id: p05-greater-or-equal
title: Greater or equal
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print a >= b. Includes the exact-boundary case (equal -> True, since >= includes equal).
cases:
  - { stdin: "5\n3",  note: "True (greater)" }
  - { stdin: "4\n4",  note: "True (equal, >= includes it)" }
  - { stdin: "3\n5",  note: "False (less)" }
  - { stdin: "0\n0",  note: "True (equal at zero)" }
