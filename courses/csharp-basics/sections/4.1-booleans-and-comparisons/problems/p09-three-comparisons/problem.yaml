id: p09-three-comparisons
title: Three comparisons
difficulty: 2
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print a < b, a == b, a > b (three lines). Exactly one is True per pair.
cases:
  - { stdin: "3\n5",  note: "True / False / False" }
  - { stdin: "5\n3",  note: "False / False / True" }
  - { stdin: "4\n4",  note: "False / True / False" }
  - { stdin: "-2\n1", note: "True / False / False" }
