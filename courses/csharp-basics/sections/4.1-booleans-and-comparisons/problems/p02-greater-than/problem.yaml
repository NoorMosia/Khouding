id: p02-greater-than
title: Greater than
difficulty: 1
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# Read a, b; print a > b. Cases straddle the boundary (greater, less, and equal -> False).
cases:
  - { stdin: "5\n3",  note: "True (greater)" }
  - { stdin: "3\n5",  note: "False (less)" }
  - { stdin: "4\n4",  note: "False (equal, > is strict)" }
  - { stdin: "-2\n-7", note: "True (less negative is greater)" }
