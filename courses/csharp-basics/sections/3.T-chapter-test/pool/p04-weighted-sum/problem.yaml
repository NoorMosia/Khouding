id: p04-weighted-sum
title: Weighted sum
difficulty: 3
grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# A, precedence: (adults + children) * price - discount. Needs parentheses, then * before -.
cases:
  - { stdin: "2\n3\n10\n5",  note: "(5)*10 - 5 = 45" }
  - { stdin: "1\n0\n20\n0",  note: "(1)*20 - 0 = 20" }
  - { stdin: "0\n4\n8\n2",   note: "(4)*8 - 2 = 30" }
  - { stdin: "5\n5\n12\n10", note: "(10)*12 - 10 = 110" }
