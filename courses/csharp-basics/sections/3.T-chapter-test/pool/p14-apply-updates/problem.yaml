# D, updating: value *= factor, then value += amount, in that order. Print the result.
cases:
  - { stdin: "5\n3\n2",  note: "5*3=15, +2 = 17" }
  - { stdin: "10\n1\n0", note: "10*1=10, +0 = 10" }
  - { stdin: "4\n0\n7",  note: "4*0=0, +7 = 7" }
  - { stdin: "6\n2\n8",  note: "6*2=12, +8 = 20" }
