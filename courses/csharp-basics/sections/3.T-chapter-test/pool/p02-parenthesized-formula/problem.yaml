grading: stdout-match
languages: [csharp]
starter:
  csharp: [starter.cs]
solution:
  csharp: [solution.cs]
# A, precedence: read a, b, c; print (a + b) * c (parentheses force the add first).
cases:
  - { stdin: "2\n3\n4",  note: "(5) * 4 = 20" }
  - { stdin: "0\n5\n6",  note: "(5) * 6 = 30" }
  - { stdin: "9\n2\n0",  note: "c zero, 0" }
  - { stdin: "5\n5\n5",  note: "(10) * 5 = 50" }
