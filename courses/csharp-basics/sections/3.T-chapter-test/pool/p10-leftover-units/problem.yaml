# C, remainder: read total seconds; print seconds % 60 (leftover past the whole minute).
cases:
  - { stdin: "125",  note: "5" }
  - { stdin: "60",   note: "0 (exact minute)" }
  - { stdin: "45",   note: "45 (under a minute)" }
  - { stdin: "3661", note: "1" }
